  <style>
    html, body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif; height: 100%; overflow: hidden; background: #09090b; color: #fafafa; }

    /* Tab content areas */
    .tab-screen { display: none; position: absolute; inset: 0; overflow-y: auto; bottom: 60px; -webkit-overflow-scrolling: touch; }

    @supports (padding-bottom: env(safe-area-inset-bottom)) {

    .card { background: #18181b; border: 1px solid #27272a; border-radius: 14px; }
    html:not(.dark) .card { background: #ffffff; border-color: #e4e4e7; }

    /* Status badges */
    .badge-live { background: linear-gradient(90deg,#f43f5e,#ec4899); color:#fff; animation: liveGlow 1.5s ease-in-out infinite; }
    @keyframes liveGlow { 0%,100% { box-shadow:0 0 0 0 rgba(244,63,94,.7); } 50% { box-shadow:0 0 0 6px rgba(244,63,94,0); } }
    .badge-risk { background:rgba(217,119,6,.15); color:#fbbf24; border:1px solid rgba(217,119,6,.3); }

    .badge-watch { background:rgba(113,113,122,.12); color:#a1a1aa; border:1px solid rgba(113,113,122,.2); }
    .badge-queued { background:rgba(99,102,241,.12); color:#a5b4fc; border:1px solid rgba(99,102,241,.2); }

    /* Pacing bar */
    .pacing-bar { height: 4px; border-radius: 2px; background: #27272a; overflow: hidden; }
    html:not(.dark) .pacing-bar { background: #e4e4e7; }

    /* Skeleton */
    .skeleton { background: linear-gradient(90deg, #27272a 25%, #3f3f46 50%, #27272a 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px; }

    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* Chip */
    .chip-up { background:rgba(16,185,129,.12); color:#34d399; }
    .chip-dn { background:rgba(244,63,94,.12); color:#f87171; }
    .chip-flat { background:rgba(113,113,122,.12); color:#a1a1aa; }
    html:not(.dark) .chip-up { background:#ecfdf5; color:#059669; }
    html:not(.dark) .chip-dn { background:#fef2f2; color:#dc2626; }

<script>
'use strict';

const GOOGLE_CLIENT_ID = '801560849080-lgdgif7rjbgap4fqqp0cbcj7duc2ed0o.apps.googleusercontent.com';
const TOPIC_COLORS = { ai_agents:'#a855f7', system_design:'#3b82f6', behavioral:'#f59e0b', data:'#10b981', ml:'#ec4899', distributed:'#6366f1' };
const TOPIC_LABELS = { ai_agents:'AI & Agents', system_design:'System Design', behavioral:'Behavioral', data:'Data', ml:'ML Eng', distributed:'Distributed' };

let currentCountry = (localStorage.getItem('ik_country') || 'IN').toUpperCase();
let currentTab     = 'events';
let lastUpcoming   = [];
let lastPast       = [];
let allMonths      = [];
let allMonthEvents = [];
let selectedMonth  = null;
let salesData      = null;
let userEmail      = '';

// ─── Theme ───────────────────────────────────────────────────
function applyTheme() {
  const dark = document.documentElement.classList.contains('dark');
  const lbl = document.getElementById('themeLabel');
  if (lbl) lbl.textContent = dark ? 'Enabled' : 'Disabled';
  const btn   = document.getElementById('themeToggleBtn');
  const thumb = document.getElementById('themeThumb');
  if (btn)   btn.style.background = dark ? '#6366f1' : '#d4d4d8';
  if (thumb) { thumb.style.right = dark ? '4px' : 'auto'; thumb.style.left = dark ? 'auto' : '4px'; }
  document.body.style.background = dark ? '#09090b' : '#fafafa';
  document.body.style.color      = dark ? '#fafafa' : '#18181b';
  // Update login card
  const lc = document.querySelector('.login-card');
  if (lc) { lc.style.background = dark ? '#18181b' : '#ffffff'; lc.style.borderColor = dark ? '#27272a' : '#e4e4e7'; }
  const lt = document.getElementById('ls-title');
  if (lt) lt.style.color = dark ? '#fafafa' : '#18181b';
}
function toggleTheme() {
  const dark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('ik_theme', dark ? 'dark' : 'light');
  applyTheme();
}

// ─── Country ─────────────────────────────────────────────────
function setCountry(c) {
  if (currentCountry === c) return;
  currentCountry = c;
  localStorage.setItem('ik_country', c);
  updateCountryUI();
  if (currentTab === 'events')  loadEvents();
  else if (currentTab === 'months') loadMonths();
  else if (currentTab === 'sales')  loadSales();
}
function isUS()      { return currentCountry === 'US'; }
function countryParam() { return isUS() ? 'US' : 'India'; }
function sym()       { return isUS() ? '$' : '₹'; }
function updateCountryUI() {
  const selCls = 'background:#6366f1;color:#fff;';
  const defCls = '';
  ['ev','m','s','prof'].forEach(pfx => {
    const inEl = document.getElementById(`${pfx}CtryIN`);
    const usEl = document.getElementById(`${pfx}CtryUS`);
    if (!inEl || !usEl) return;
    inEl.style.cssText = currentCountry === 'IN' ? selCls : defCls;
    usEl.style.cssText = currentCountry === 'US' ? selCls : defCls;
    // Profile buttons have border
    if (pfx === 'prof') {
      inEl.style.borderColor = currentCountry === 'IN' ? '#6366f1' : '#3f3f46';
      usEl.style.borderColor = currentCountry === 'US' ? '#6366f1' : '#3f3f46';
      inEl.style.color = currentCountry === 'IN' ? '#a5b4fc' : '#71717a';
      usEl.style.color = currentCountry === 'US' ? '#a5b4fc' : '#71717a';
      inEl.style.background = currentCountry === 'IN' ? 'rgba(99,102,241,.12)' : 'transparent';
      usEl.style.background = currentCountry === 'US' ? 'rgba(99,102,241,.12)' : 'transparent';
    }
  });
}

// ─── Tab switching ───────────────────────────────────────────
function switchTab(tab) {
  if (tab === currentTab) return;
  // Hide old
  document.getElementById(`tab-${currentTab}`)?.classList.remove('active');
  document.getElementById(`nav-${currentTab}`)?.classList.remove('active');
  currentTab = tab;
  document.getElementById(`tab-${tab}`).classList.add('active');
  document.getElementById(`nav-${tab}`).classList.add('active');

  // Lazy-load
  if (tab === 'months' && allMonths.length === 0) loadMonths();
  if (tab === 'sales' && salesData === null) loadSales();
}

// ─── Helpers ─────────────────────────────────────────────────
function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function fmtN(n) {
  if (n == null || isNaN(n)) return '—';
  if (isUS()) {
    if (n >= 1e9) return (n/1e9).toFixed(1).replace(/\.0$/,'') + 'B';
    if (n >= 1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'') + 'M';
    if (n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,'') + 'K';
    return Math.round(n).toLocaleString();
  }
  if (n >= 1e7) return (n/1e7).toFixed(2).replace(/\.00$/,'').replace(/0$/,'') + 'Cr';
  if (n >= 1e5) return (n/1e5).toFixed(1).replace(/\.0$/,'') + 'L';
  if (n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,'') + 'k';
  return Math.round(n).toLocaleString();
}
function fmtMoney(n)  { return n == null ? '—' : sym() + fmtN(n); }
function fmtPct(n)    { return n == null ? '—' : n.toFixed(1) + '%'; }
function fmtROAS(n)   { return n == null || isNaN(n) ? '—' : n.toFixed(2) + 'x'; }
function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('en-US', {month:'short', day:'numeric'});
}
function fmtCountdown(iso) {
  if (!iso) return '—';
  const diff = new Date(iso) - new Date();
  if (diff < 0) {
    const h = Math.round(-diff / 3.6e6);
    return h < 24 ? `${h}h ago` : `${Math.round(h/24)}d ago`;
  }
  const h = diff / 3.6e6;
  if (h < 24) return `in ${Math.floor(h)}h ${Math.round((h%1)*60)}m`;
  return Math.floor(h/24) === 1 ? 'tomorrow' : `in ${Math.floor(h/24)}d`;
}
function initials(name) {
  if (!name) return 'IK';
  return name.split(/\s+/).filter(Boolean).map(s=>s[0]).slice(0,2).join('').toUpperCase();
}
function topicColor(t) { return TOPIC_COLORS[t] || '#6366f1'; }
function topicLabel(t) { return TOPIC_LABELS[t] || 'General'; }

function goalPct(ev) {
  const t = ev.snapshot?.total_regs, g = ev.goal_regs;
  return (t != null && g > 0) ? Math.min(150, 100*t/g) : null;
}
function statusFor(ev) {
  const s = ev.snapshot || {};
  const hrs = s.hours_to_live;
  const g = goalPct(ev);
  if (!ev.live_at || ev.goal_regs == null) return 'setup';
  if (hrs == null || s.total_regs == null) return 'queued';
  if (hrs < 24 && hrs > -2) return 'live';
  if (g != null && g < 70 && hrs < 168) return 'at_risk';
  if (g != null && g >= 100) return 'on_track';
  return 'watch';
}
function badgeHTML(st) {
  const MAP = {
    live:     ['Going live','badge-live'],
    at_risk:  ['At risk','badge-risk'],
    on_track: ['On track','badge-track'],
    watch:    ['Watch','badge-watch'],
    queued:   ['Queued','badge-queued'],
    setup:    ['Setup','badge-watch'],
  };
  const [label, cls] = MAP[st] || ['','badge-watch'];
  return `<span class="text-xs font-semibold px-2 py-0.5 rounded-full ${cls}">${esc(label)}</span>`;
}

function chipDelta(curr, prev) {
  if (curr == null || prev == null || prev === 0) return '';
  const d = ((curr - prev) / Math.abs(prev) * 100).toFixed(0);
  const cls = d > 0 ? 'chip-up' : d < 0 ? 'chip-dn' : 'chip-flat';
  return `<span class="text-xs font-bold px-1.5 py-0.5 rounded ${cls}">${d > 0 ? '+' : ''}${d}%</span>`;
}

function monthLabel(slug) {
  if (!slug) return '—';
  const [y, m] = slug.split('-');
  return new Date(+y, +m-1, 1).toLocaleDateString('en-US', {month:'short', year:'2-digit'});
}

    const c = encodeURIComponent(countryParam());

// ─── MONTHS TAB ───────────────────────────────────────────────
async function loadMonths() {
  document.getElementById('mLoading').style.display = '';
  document.getElementById('mContent').style.display = 'none';
  try {
    const r = await fetch(`/months?country=${encodeURIComponent(countryParam())}`);
    const d = await r.json();
    allMonthEvents = d.events || [];
    allMonths = (d.months || []).sort((a,b) => a.month_slug < b.month_slug ? -1 : 1);
    // Default to latest month (excluding future)
    const now = new Date();
    const curSlug = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
    const pastMonths = allMonths.filter(m => m.month_slug <= curSlug);
    selectedMonth = pastMonths.length ? pastMonths[pastMonths.length-1].month_slug : (allMonths[allMonths.length-1]?.month_slug || null);
    renderMonthPills();
    renderMonthData();
  } catch(e) {
    document.getElementById('mLoading').innerHTML = `<div class="text-center text-sm py-8" style="color:#f87171;">Failed to load: ${esc(e.message)}</div>`;
  }
}

function renderMonthPills() {
  const container = document.getElementById('monthPills');
  const now = new Date();
  const curSlug = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const months = allMonths.filter(m => m.month_slug <= curSlug);
  container.innerHTML = months.map(m => `
    <button class="month-pill${m.month_slug === selectedMonth ? ' sel' : ''}" onclick="selectMonth('${m.month_slug}')">${monthLabel(m.month_slug)}</button>
  `).join('');
  // Scroll active pill into view
  setTimeout(() => {
    const sel = container.querySelector('.month-pill.sel');
    if (sel) sel.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  }, 50);
}

function selectMonth(slug) {
  selectedMonth = slug;
  renderMonthPills();
  renderMonthData();
}

function renderMonthData() {
  document.getElementById('mLoading').style.display = 'none';
  document.getElementById('mContent').style.display = '';

  const m = allMonths.find(x => x.month_slug === selectedMonth);
  if (!m) return;

  const months = allMonths.filter(x => x.month_slug <= selectedMonth);
  const prev = months.length >= 2 ? months[months.length-2] : null;

  // ── KPI Cards ──
  const kpiData = [
    { label: 'IQLs', value: fmtN(m.total_regs), prev: prev?.total_regs, curr: m.total_regs },
    { label: 'Booked ' + sym(), value: fmtMoney(m.revenue_booked), prev: prev?.revenue_booked, curr: m.revenue_booked },
    { label: 'Collected ' + sym(), value: fmtMoney(m.revenue), prev: prev?.revenue, curr: m.revenue },
    { label: 'ROAS', value: fmtROAS(m.overall_roas), prev: null, curr: null },
    { label: 'Meta Spend', value: fmtMoney(m.meta_spend), prev: prev?.meta_spend, curr: m.meta_spend },
    { label: 'CPL', value: m.cpl_blended != null ? sym() + fmtN(m.cpl_blended) : '—', prev: null, curr: null },
  ];
  document.getElementById('mKpiGrid').innerHTML = kpiData.map(k => `
    <div class="card p-3">
      <div class="kpi-label mb-1">${esc(k.label)}</div>
      <div class="kpi-value text-xl">${esc(k.value)}</div>
      ${k.prev != null ? `<div class="mt-1">${chipDelta(k.curr, k.prev)}</div>` : ''}
    </div>
  `).join('');

  // ── Bar chart: IQL trend ──
  const now = new Date();
  const curSlug = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const chartMonths = allMonths.filter(m2 => m2.month_slug <= curSlug).slice(-8);
  const maxRegs = Math.max(...chartMonths.map(x => x.total_regs || 0), 1);
  const barW = 100 / chartMonths.length;
  const bars = chartMonths.map((x, i) => {
    const h = ((x.total_regs || 0) / maxRegs * 100).toFixed(0);
    const isSel = x.month_slug === selectedMonth;
    return `
      <g onclick="selectMonth('${x.month_slug}')" style="cursor:pointer;">
        <rect x="${(i * barW + 1).toFixed(1)}%" y="${(100 - h).toFixed(0)}%" width="${(barW - 2).toFixed(1)}%"
          height="${h}%" rx="3"
          fill="${isSel ? '#6366f1' : '#3f3f46'}"
          class="bar-chart-bar"/>
        <text x="${((i + 0.5) * barW).toFixed(1)}%" y="100%" dy="-2" text-anchor="middle"
          style="font-size:8px;fill:${isSel ? '#a5b4fc' : '#71717a'};">
          ${monthLabel(x.month_slug).split(' ')[0]}
        </text>
      </g>`;
  }).join('');
  document.getElementById('mBarChart').innerHTML = `<svg width="100%" height="80" viewBox="0 0 100 80" preserveAspectRatio="none" style="overflow:visible;">${bars}</svg>`;

  // ── Call stats ──
  const phases = [
    { label: '0–2D', att: m.call_p2_attempts, con: m.call_p2_connects },
    { label: '0–7D', att: m.call_p7_attempts, con: m.call_p7_connects },
    { label: '0–14D', att: m.call_p14_attempts, con: m.call_p14_connects },
    { label: '14D+', att: m.call_p14p_attempts, con: m.call_p14p_connects },
  ];
  document.getElementById('mCallStats').innerHTML = phases.map(p => {
    const rate = (p.att > 0) ? (p.con / p.att * 100).toFixed(0) : null;
    const rateColor = rate == null ? '#71717a' : rate >= 50 ? '#10b981' : rate >= 30 ? '#f59e0b' : '#f87171';
    const w = rate ? `${rate}%` : '0%';
    return `
      <div>
        <div class="flex justify-between text-xs mb-1">
          <span style="color:#a1a1aa;">${p.label}</span>
          <span>${p.att ? p.att.toLocaleString() + ' att' : '—'}${rate != null ? ` · <span style="color:${rateColor};">${rate}% conn</span>` : ''}</span>
        </div>
        <div class="pacing-bar"><div style="width:${w};height:100%;border-radius:2px;background:${rateColor};"></div></div>
      </div>`;
  }).join('');

  // ── Lead quality roles ──
  const roles = [
    { label: 'SDE', val: m.role_sde },
    { label: 'ML', val: m.role_ml },
    { label: 'Mgmt', val: m.role_management },
    { label: 'Systems', val: m.role_systems },
  ];
  const totalRoles = roles.reduce((a,r) => a + (r.val || 0), 0);
  const roleColors = ['#6366f1','#10b981','#f59e0b','#3b82f6'];
  document.getElementById('mRoleChart').innerHTML = roles.map((r, i) => {
    const pct = totalRoles > 0 && r.val ? (r.val / totalRoles * 100).toFixed(0) : 0;
    return `
      <div class="flex items-center gap-2 mb-1.5">
        <div style="width:8px;height:8px;border-radius:2px;background:${roleColors[i]};flex-shrink:0;"></div>
        <div class="text-xs flex-1" style="color:#a1a1aa;">${r.label}</div>
        <div class="text-xs" style="color:#a1a1aa;">${r.val ?? 0}</div>
        <div style="width:80px;height:6px;border-radius:3px;background:#27272a;overflow:hidden;flex-shrink:0;">
          <div style="width:${pct}%;height:100%;border-radius:3px;background:${roleColors[i]};"></div>
        </div>
        <div class="text-xs font-semibold" style="color:#fafafa;width:28px;text-align:right;">${pct}%</div>
      </div>`;
  }).join('');

  // ── Event list ──
  const events = allMonthEvents.filter(e => e.month_slug === selectedMonth).sort((a,b) => new Date(b.live_at||0) - new Date(a.live_at||0));
  document.getElementById('mEventList').innerHTML = events.length === 0
    ? `<div class="px-4 py-6 text-center text-sm" style="color:#71717a;">No events this month</div>`
    : events.map(ev => {
      const c = topicColor(ev.topic);
      return `
        <a href="/event.html?id=${encodeURIComponent(ev.event_id)}" class="flex items-center gap-3 px-4 py-3 border-b no-underline" style="border-color:#27272a;">
          <div style="width:3px;height:40px;border-radius:2px;background:${c};flex-shrink:0;"></div>
          <div class="flex-1 min-w-0">
            <div class="text-sm font-semibold truncate">${esc(ev.title||'—')}</div>
            <div class="text-xs mt-0.5" style="color:#71717a;">${fmtDate(ev.live_at)} · ${esc(ev.instructor_name||'')}</div>
          </div>
          <div class="text-right flex-shrink-0">
            <div class="text-sm font-bold tabular">${fmtN(ev.total_regs)}</div>
            <div class="text-xs" style="color:#71717a;">regs</div>
          </div>
        </a>`;
    }).join('');
}

function renderSales() {
  document.getElementById('sLoading').style.display = 'none';
  document.getElementById('sContent').style.display = '';

    { label: 'Total Sales', value: String(totalSales) },
    { label: 'Revenue ' + sym(), value: fmtMoney(totalRevenue) },

      <div class="kpi-label mb-1">${esc(k.label)}</div>
      <div class="kpi-value text-xl">${esc(k.value)}</div>
    </div>

  // Group by month for display
  const byMonth = {};
  sales.forEach(s => {
    const mo = (s.sale_date || '').slice(0,7) || 'Unknown';
    if (!byMonth[mo]) byMonth[mo] = [];
    byMonth[mo].push(s);

  const monthGroups = Object.keys(byMonth).sort((a,b) => b.localeCompare(a)).slice(0,6);

  document.getElementById('sSalesList').innerHTML = sales.length === 0
    ? `<div class="px-4 py-6 text-center text-sm" style="color:#71717a;">No sales data</div>`
    : monthGroups.map(mo => {

        const mRev   = mSales.reduce((a,s) => a + (s.revenue||0), 0);
        const rows   = mSales.slice(0,8).map(sale => `
          <div class="flex items-center gap-3 px-4 py-2.5 border-b" style="border-color:#27272a;">
            <div class="flex-1 min-w-0">
              <div class="text-sm truncate">${esc(sale.event_title || '—')}</div>
              <div class="text-xs mt-0.5" style="color:#71717a;">${esc(sale.channel||'—')} · ${esc(fmtDate(sale.sale_date))}</div>
            </div>
            <div class="text-sm font-bold tabular" style="color:#34d399;">${fmtMoney(sale.revenue)}</div>
          </div>`).join('');
        return `
          <div class="px-4 py-2.5 flex justify-between items-center" style="background:rgba(39,39,42,.3);">
            <div class="text-xs font-semibold uppercase tracking-widest" style="color:#a1a1aa;">${monthLabel(mo)}</div>
            <div class="text-xs font-bold" style="color:#fafafa;">${mSales.length} sales · ${fmtMoney(mRev)}</div>
          </div>
          ${rows}`;
      }).join('');
}

// ─── Init ─────────────────────────────────────────────────────
applyTheme();
updateCountryUI();
checkAuth();
</script>
</body>
</html>
