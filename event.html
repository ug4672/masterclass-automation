// ── Helpers ─────────────────────────────────────────────────────────────────
function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(iso) { return iso ? new Date(iso).toLocaleDateString('en-US', { month:'short', day:'numeric' }) : '—'; }
function fmtDateTime(iso) { return iso ? new Date(iso).toLocaleString('en-US', { weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit', timeZone:'Asia/Kolkata' }) + ' IST' : '—'; }
function fmtCountdown(iso) {
  if (!iso) return '—';
  const diffMs = new Date(iso) - new Date();
  if (diffMs < 0) {
    const h = Math.round(-diffMs / 3600000);
    return h < 24 ? `Aired ${h}h ago` : `Aired ${Math.round(h/24)}d ago`;
  }
  const h = diffMs / 3600000;
  if (h < 24) return `Live in ${Math.floor(h)}h ${Math.round((h % 1) * 60)}m`;
  return `In ${Math.floor(h/24)} days`;
}
function fmtNum(n) { if (n == null) return '—'; if (n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,'') + 'k'; return Math.round(n).toLocaleString(); }
function fmtMoney(n, sym) { return n == null ? '—' : (sym || '₹') + Math.round(n).toLocaleString(); }
function fmtMoneyAbbr(n, country) {
  if (n == null || isNaN(n)) return '—';
  const sym = moneySym(country);
  if (isUSCountry(country)) {
    if (n >= 1e9) return sym + (n/1e9).toFixed(2).replace(/\.?0+$/,'') + 'B';
    if (n >= 1e6) return sym + (n/1e6).toFixed(2).replace(/\.?0+$/,'') + 'M';
    if (n >= 1000) return sym + (n/1000).toFixed(1).replace(/\.0$/,'') + 'K';
    return sym + Math.round(n).toLocaleString();
  }
  if (n >= 1e7) return sym + (n/1e7).toFixed(2).replace(/\.?0+$/,'') + ' Cr';
  if (n >= 1e5) return sym + (n/1e5).toFixed(2).replace(/\.?0+$/,'') + ' L';
  if (n >= 1000) return sym + (n/1000).toFixed(1).replace(/\.0$/,'') + 'k';
  return sym + Math.round(n).toLocaleString();
}
function fmtROAS(n) { return n == null || isNaN(n) ? '—' : n.toFixed(2) + 'x'; }
function isUSCountry(c) { const s = (c || '').toLowerCase(); return s === 'us' || s === 'usa'; }
function leadLabel(c, opts) {
  // India tracks IQLs; US tracks GQLs. CPIQL / CPGQL likewise.
  return isUSCountry(c) ? (opts?.long ? 'GQLs' : 'GQL') : (opts?.long ? 'IQLs' : 'IQL');
}
function cplLabel(c) { return isUSCountry(c) ? 'CPGQL' : 'CPIQL'; }
function moneySym(c) { return isUSCountry(c) ? '$' : '₹'; }
function fmtPct(n)   { return n == null ? '—' : n.toFixed(1) + '%'; }
function initials(name) { return name ? name.split(/\s+/).filter(Boolean).map(s => s[0]).slice(0,2).join('').toUpperCase() : 'IK'; }
function topicVar(t)   { return TOPIC_VAR[t]   || '--topic-ai'; }
function topicLabel(t) { return TOPIC_LABEL[t] || 'General'; }
function countryFlag(c) {
  const s = (c || '').toLowerCase();
  if (s === 'us' || s === 'usa' || s === 'united states') return '🇺🇸';
  if (s === 'india' || s === 'in') return '🇮🇳';
  if (s === 'canada' || s === 'ca') return '🇨🇦';
  if (s === 'uk' || s === 'united kingdom' || s === 'gb') return '🇬🇧';
  return '🌐';
}

// ── Data ────────────────────────────────────────────────────────────────────
function getEventId() {
  return new URLSearchParams(window.location.search).get('id') || '';
}

async function refreshEvent(eventId) {
  const btn = document.getElementById('refreshBtn');
  const lbl = document.getElementById('refreshLbl');
  const icon = document.getElementById('refreshIcon');
  if (!btn || btn.disabled) return;
  btn.disabled = true;
  const original = lbl.textContent;
  lbl.textContent = 'Refreshing…';
  if (icon) icon.classList.add('animate-spin');
  btn.classList.add('opacity-60', 'cursor-wait');
  try {
    const r = await fetch(`/events/${encodeURIComponent(eventId)}/refresh`, { method: 'POST' });
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      throw new Error(d.error || `HTTP ${r.status}`);
    }
    // load() rebuilds the whole mainArea, so this button is replaced by a fresh one.
    // bypassCache:true skips the 60s HTTP cache on /events/<id> so we see the row
    // the refresh just wrote (not the pre-refresh cached response).
    await load({ bypassCache: true });
  } catch (e) {
    lbl.textContent = 'Failed: ' + e.message;
    if (icon) icon.classList.remove('animate-spin');
    btn.classList.remove('opacity-60', 'cursor-wait');
    btn.classList.add('text-rose-600', 'border-rose-300');
    setTimeout(() => {
      lbl.textContent = original;
      btn.disabled = false;
      btn.classList.remove('text-rose-600', 'border-rose-300');
    }, 5000);
  }
}

async function exportPollQna(eventId) {
  const btn = document.getElementById('pollReportBtn');
  const lbl = document.getElementById('pollReportLbl');
  if (!btn || btn.disabled) return;
  btn.disabled = true;
  const original = lbl.textContent;
  lbl.textContent = 'Building file…';
  btn.classList.add('opacity-60');
  try {
    const r = await fetch(`/event/poll-qna-export?event_id=${encodeURIComponent(eventId)}`);
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      throw new Error(d.error || `HTTP ${r.status}`);
    }
    const blob = await r.blob();
    // Derive filename from Content-Disposition or fall back to a sensible default
    const cd = r.headers.get('Content-Disposition') || '';
    const m = cd.match(/filename="([^"]+)"/);
    const fname = m ? m[1] : `polls-qna_${eventId}.xlsx`;
    const polls = r.headers.get('X-Poll-Rows') || '?';
    const qna   = r.headers.get('X-Qna-Rows')  || '?';
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    lbl.textContent = `Downloaded (${polls} polls · ${qna} Q&A)`;
    setTimeout(() => { lbl.textContent = original; btn.disabled = false; btn.classList.remove('opacity-60'); }, 4000);
  } catch (e) {
    lbl.textContent = 'Failed: ' + e.message;
    btn.classList.remove('opacity-60');
    btn.classList.add('text-rose-600');
    setTimeout(() => { lbl.textContent = original; btn.disabled = false; btn.classList.remove('text-rose-600'); }, 5000);
  }
}

async function load(opts = {}) {
  const id = getEventId();
  if (!id) {
    document.getElementById('mainArea').innerHTML = '<div class="p-12 text-center text-rose-600">Missing event id. <a href="/hub.html" class="underline">Back to Hub</a></div>';
    return;
  }
  try {
    // After a Refresh, bypass the 60s HTTP cache on /events/<id> — otherwise
    // the browser serves the pre-refresh response and the page looks unchanged.
    const fetchOpts = opts.bypassCache ? { cache: 'no-store' } : undefined;
    const r = await fetch(`/events/${encodeURIComponent(id)}`, fetchOpts);
    if (r.status === 404) { document.getElementById('mainArea').innerHTML = '<div class="p-12 text-center text-zinc-500">Event not found. <a href="/hub.html" class="underline">Back to Hub</a></div>'; return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    render(d);
  } catch (e) {
    document.getElementById('mainArea').innerHTML = `<div class="p-12 text-center text-rose-600">Failed to load: ${esc(e.message)}</div>`;
  }
}

function renderFunnel(s, ev) {
  const sym = moneySym(ev && ev.country);
  const lead = leadLabel(ev && ev.country, {long:true});
  const lanes = isUSCountry(ev && ev.country)
    ? [
        // US: 6 channel buckets from utm_campaign classification.
        ['YT',         s.us_yt_regs         || 0, '#ef4444'],
        ['Social',     s.us_social_regs     || 0, '#1877f2'],
        ['L10X Email', s.us_l10x_email_regs || 0, '#10b981'],
        ['L10X Bot',   s.us_l10x_bot_regs   || 0, '#8b5cf6'],
        ['NI Base',    s.us_ni_base_regs    || 0, '#f59e0b'],
        ['Other',      s.us_other_regs      || 0, '#a1a1aa'],
      ]
    : [
        ['Meta',   s.meta_regs  || 0, '#1877f2'],
        ['CRM',    s.crm_regs   || 0, '#10b981'],
        ['Others', s.other_regs || 0, '#a1a1aa'],
      ];
  const total = lanes.reduce((a, [, n]) => a + n, 0);
  if (total === 0) return '<div class="text-xs text-zinc-400 italic py-4">No registration data yet.</div>';

  // Per-channel attendance: prefer real numbers from /events/:id; fall back to
  // overall-rate approximation if absent (event not aired or query failed).
  const realCA = s._channel_attendance || null;
  const overallRate = (s.attendees && total > 0) ? Math.min(1, s.attendees / total) : null;
  const showAttended = realCA != null || overallRate != null;
  const isApprox     = !realCA && overallRate != null;

  const attendedFor = label => {
    if (realCA && realCA[label] && realCA[label].attendees != null) return realCA[label].attendees;
    if (overallRate != null) {
      const n = lanes.find(([l]) => l === label)?.[1] ?? 0;
      return Math.round(n * overallRate);
    }
    return null;
  };

  // Bar widths are % of TOTAL registered (so users can visually compare bars
  // both across channels AND within a channel — attended bar narrower than
  // registered bar = drop-off).
  const widthOf = n => total > 0 ? (100 * n / total) : 0;

  const rows = lanes.map(([label, n, color]) => {
    const attendedN = showAttended ? attendedFor(label) : null;
    const regW     = widthOf(n);
    const attW     = (showAttended && attendedN != null) ? widthOf(attendedN) : 0;
    const convPct  = (n > 0 && attendedN != null) ? (100 * attendedN / n) : null;
    const convCls  = convPct == null ? 'text-zinc-400'
                   : convPct >= 70 ? 'text-emerald-600'
                   : convPct >= 50 ? 'text-zinc-700'
                   : 'text-amber-600';
    return `
      <div>
        <div class="flex items-baseline justify-between mb-2 gap-3">
          <div class="flex items-center gap-2 min-w-0">
            <span class="w-2 h-2 rounded-sm shrink-0" style="background:${color};"></span>
            <span class="text-sm font-semibold text-zinc-900 truncate">${esc(label)}</span>
          </div>
          <div class="flex items-baseline gap-3 text-xs whitespace-nowrap shrink-0">
            <span class="text-zinc-500 tabular-nums">${fmtNum(n)} leads</span>
            ${showAttended && attendedN != null ? `<span class="text-zinc-900 font-semibold tabular-nums">→ ${fmtNum(attendedN)} attended</span>` : ''}
            ${convPct != null ? `<span class="${convCls} font-bold tabular-nums">${convPct.toFixed(0)}%</span>` : ''}
          </div>
        </div>
        <div class="space-y-1">
          <div class="flex items-center gap-2">
            <span class="text-[9px] uppercase font-bold text-zinc-400 tracking-wider w-8 shrink-0">Reg</span>
            <div class="flex-1 h-2 bg-zinc-100 rounded-full overflow-hidden">
              <div class="h-full rounded-full" style="width:${regW}%; background:${color}; opacity:0.45;"></div>
            </div>
          </div>
          ${showAttended ? `
          <div class="flex items-center gap-2">
            <span class="text-[9px] uppercase font-bold text-zinc-400 tracking-wider w-8 shrink-0">Att</span>
            <div class="flex-1 h-2 bg-zinc-100 rounded-full overflow-hidden">
              <div class="h-full rounded-full" style="width:${attW}%; background:${color};"></div>
            </div>
          </div>` : ''}
        </div>
      </div>`;
  }).join('');

  const legend = showAttended ? `
    <div class="flex items-center gap-4 text-[10px] text-zinc-500 mt-5 pt-3 border-t border-zinc-100">
      ${isApprox ? `<span class="text-zinc-400">Per-channel attendance approximated using overall ${fmtPct(100 * overallRate)} attendance rate</span>` : '<span class="text-emerald-600">Per-channel attendance from Zoom roster</span>'}
    </div>` : '';

  return `<div class="space-y-5">${rows}</div>${legend}`;
}

function renderQuality(s) {
  // Bucket labels match the legacy Leads section. role_ml stores "Data";
  // we_3_5 stores "0-5" — column names are misleading but kept for back-compat.
  const roleBuckets = [
    ['Data',              s.role_ml         || 0],
    ['Software Engineer', s.role_sde        || 0],
    ['Management',        s.role_management || 0],
    ['Systems',           s.role_systems    || 0],
    ['Null',              s.role_null       || 0],
    ['Other',             s.role_other      || 0],
  ];
  const weBuckets = [
    ['0–5 years',   s.we_3_5    || 0],
    ['5–10 years',  s.we_6_10   || 0],
    ['10–15 years', s.we_10_15  || 0],
    ['15–20 years', s.we_15_20  || 0],
    ['20+ years',   s.we_20p    || 0],
    ['Other',       s.we_other  || 0],
  ];
  const roleTotal = roleBuckets.reduce((a, [, n]) => a + n, 0);
  const weTotal   = weBuckets.reduce((a, [, n]) => a + n, 0);
  if (roleTotal === 0 && weTotal === 0) return '<div class="text-xs text-zinc-400 italic">Cohort breakdown not yet snapshotted.</div>';
  const bar = (label, val, total) => {
    const pct = total > 0 ? (100 * val / total) : 0;
    return `
    <div class="flex items-center justify-between text-xs gap-3">
      <span class="text-zinc-700 truncate">${esc(label)}</span>
      <div class="flex items-center gap-2 shrink-0">
        <div class="w-24 h-1.5 progress-track rounded-full overflow-hidden">
          <div class="topic-fill h-full" style="width: ${pct.toFixed(0)}%;"></div>
        </div>
        <span class="font-semibold text-zinc-900 w-12 text-right tabular-nums">${pct.toFixed(1)}%</span>
      </div>
    </div>`;
  };
  // Hide empty buckets (Null role and 0-5 work_ex are usually 0).
  // Percentages stay relative to the full total so they remain accurate.
  const roleVisible = roleBuckets.filter(([, n]) => n > 0);
  const weVisible   = weBuckets.filter(([, n]) => n > 0);
  return `
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div>
        <div class="text-[10px] uppercase tracking-wider text-zinc-500 font-semibold mb-3">Role category</div>
        <div class="space-y-2">
          ${roleVisible.map(([l, n]) => bar(l, n, roleTotal)).join('')}
        </div>
      </div>
      <div>
        <div class="text-[10px] uppercase tracking-wider text-zinc-500 font-semibold mb-3">Work experience</div>
        <div class="space-y-2">
          ${weVisible.map(([l, n]) => bar(l, n, weTotal)).join('')}
        </div>
      </div>
    </div>`;
}

// ── Call Efforts — full lifecycle dashboard (5 stages, summary, trends, insights)
function renderCallEfforts(s, isAired) {
  if (!isAired) {
    return `<div class="text-center py-8 text-xs text-zinc-400">Call efforts populate after the event airs.</div>`;
  }
  if (!s || !s.call_total_leads) {
    return `<div class="text-center py-8 text-xs text-zinc-400">Call lifecycle data unavailable for this event.</div>`;
  }

  const totalLeads = s.call_total_leads || 0;
  const safe = v => (v == null || isNaN(v)) ? 0 : v;

  const STAGES = [
    { key:'pre',  label:'Pre Webinar', sub:'Before event',   color:'#6366f1' },
    { key:'p2',   label:'0–2 Days',    sub:'First 48 hours', color:'#8b5cf6' },
    { key:'p7',   label:'0–7 Days',    sub:'First week',     color:'#ec4899' },
    { key:'p14',  label:'0–14 Days',   sub:'First 2 weeks',  color:'#f59e0b' },
    { key:'p14p', label:'14D+',        sub:'Long tail',      color:'#10b981' },
  ];

  const M = STAGES.map(st => {
    const k = st.key;
    const attempts = safe(s[`call_${k}_attempts`]);
    const connects = safe(s[`call_${k}_connects`]);
    const talkMins = safe(s[`call_${k}_talk_mins`]);
    const covered  = safe(s[`call_${k}_covered`]);
    return {
      ...st, attempts, connects, talkMins, covered,
      avgPerUser:   totalLeads > 0 ? attempts / totalLeads : 0,
      coverage:     totalLeads > 0 ? covered / totalLeads * 100 : 0,
      connectivity: attempts > 0 ? connects / attempts * 100 : 0,
      talkPerUser:  totalLeads > 0 ? talkMins / totalLeads : 0,
    };
  });

  // Aggregate non-overlapping totals: pre + p_14d (covers post 0–14D inclusive) + p_14p (14+)
  const SUM_IDX = [0, 3, 4];
  const totalAttempts = SUM_IDX.reduce((a,i) => a + M[i].attempts, 0);
  const totalConnects = SUM_IDX.reduce((a,i) => a + M[i].connects, 0);
  const totalTalkMins = SUM_IDX.reduce((a,i) => a + M[i].talkMins, 0);
  const overallCoverage     = Math.max(...M.map(m => m.coverage));
  const overallConnectivity = totalAttempts > 0 ? (totalConnects / totalAttempts * 100) : 0;

  // ── Helpers ────────────────────────────────────────────────────────────────
  const ring = (pct, color, size=58) => {
    const r = size/2 - 5;
    const c = 2*Math.PI*r;
    const dash = Math.min(100, Math.max(0, pct)) / 100 * c;
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="shrink-0">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(0,0,0,.07)" stroke-width="4" class="dark:[stroke:rgba(255,255,255,.08)]"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${esc(color)}" stroke-width="4"
              stroke-dasharray="${dash.toFixed(1)} ${c.toFixed(1)}" stroke-linecap="round"
              transform="rotate(-90 ${size/2} ${size/2})"/>
      <text x="${size/2}" y="${size/2}" text-anchor="middle" dominant-baseline="central"
            fill="${esc(color)}" font-size="11" font-weight="700" font-family="Inter,sans-serif">${pct.toFixed(0)}%</text>
    </svg>`;
  };

  const fmtMins = m => {
    if (m == null || m === 0) return '0 mins';
    if (m < 1) return (m*60).toFixed(0) + ' sec';
    return m.toFixed(1) + ' mins';
  };
  const fmtTotalMins = m => {
    if (m == null) return '—';
    if (m >= 60) return (m/60).toFixed(1) + ' hrs';
    return Math.round(m) + ' mins';
  };

  // ── Executive summary strip ────────────────────────────────────────────────
  const summary = `
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
      <div class="rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/50 px-4 py-3">
        <div class="text-[10px] uppercase tracking-wider text-zinc-400 font-semibold">Total Calls Made</div>
        <div class="text-2xl font-bold text-zinc-900 dark:text-white tabular-nums mt-1">${fmtNum(totalAttempts)}</div>
        <div class="text-[11px] text-zinc-400 mt-0.5">across all stages</div>
      </div>
      <div class="rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/50 px-4 py-3">
        <div class="text-[10px] uppercase tracking-wider text-zinc-400 font-semibold">Overall Coverage</div>
        <div class="text-2xl font-bold text-zinc-900 dark:text-white tabular-nums mt-1">${overallCoverage.toFixed(1)}%</div>
        <div class="text-[11px] text-zinc-400 mt-0.5">of ${fmtNum(totalLeads)} registered users</div>
      </div>
      <div class="rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/50 px-4 py-3">
        <div class="text-[10px] uppercase tracking-wider text-zinc-400 font-semibold">Overall Connectivity</div>
        <div class="text-2xl font-bold text-zinc-900 dark:text-white tabular-nums mt-1">${overallConnectivity.toFixed(1)}%</div>
        <div class="text-[11px] text-zinc-400 mt-0.5">of all call attempts</div>
      </div>
      <div class="rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/50 px-4 py-3">
        <div class="text-[10px] uppercase tracking-wider text-zinc-400 font-semibold">Total Talk Time</div>
        <div class="text-2xl font-bold text-zinc-900 dark:text-white tabular-nums mt-1">${fmtTotalMins(totalTalkMins)}</div>
        <div class="text-[11px] text-zinc-400 mt-0.5">connected calls only</div>
      </div>
    </div>`;

  // ── Trend layer: bar chart for Avg Calls/User + Connectivity ──────────────
  const bars = (vals, color, fmt) => {
    const max = Math.max(...vals, 0.001);
    return STAGES.map((st, i) => {
      const v = vals[i];
      const w = Math.max(2, (v / max) * 100);
      return `<div class="flex items-center gap-2 text-[11px]">
        <span class="w-16 sm:w-20 text-zinc-500 dark:text-zinc-400 shrink-0">${esc(st.label)}</span>
        <div class="flex-1 h-1.5 bg-zinc-100 dark:bg-zinc-800 rounded-full overflow-hidden">
          <div class="h-full rounded-full" style="width:${w.toFixed(1)}%;background:${esc(color)};"></div>
        </div>
        <span class="w-12 text-right font-semibold text-zinc-900 dark:text-white tabular-nums">${fmt(v)}</span>
      </div>`;
    }).join('');
  };

  const trend = `
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-3 mb-6">
      <div class="rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/50 p-4">
        <div class="text-[10px] uppercase tracking-wider text-zinc-400 font-semibold mb-3">Avg Calls / User by stage</div>
        <div class="space-y-2">${bars(M.map(m=>m.avgPerUser), '#6366f1', v => v.toFixed(2))}</div>
      </div>
      <div class="rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/50 p-4">
        <div class="text-[10px] uppercase tracking-wider text-zinc-400 font-semibold mb-3">Connectivity % by stage</div>
        <div class="space-y-2">${bars(M.map(m=>m.connectivity), '#10b981', v => v.toFixed(1)+'%')}</div>
      </div>
    </div>`;

  // ── Stage timeline cards ──────────────────────────────────────────────────
  const timeline = `
    <div class="relative">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 relative">
        ${M.map((m, i) => `
        <div class="relative rounded-2xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/60 p-4 hover:shadow-lg hover:-translate-y-0.5 transition-all">
          <div class="absolute top-0 left-0 right-0 h-0.5 rounded-t-2xl" style="background:linear-gradient(90deg, ${esc(m.color)} 0%, ${esc(m.color)}88 100%);"></div>
          <div class="flex items-center justify-between mb-1">
            <div class="text-[10px] uppercase tracking-wider font-bold" style="color:${esc(m.color)};">Stage ${i+1}</div>
            ${i<M.length-1 ? `<svg class="w-3 h-3 text-zinc-300 dark:text-zinc-700 hidden lg:block absolute -right-2.5 top-1/2 -translate-y-1/2 z-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>` : ''}
          </div>
          <div class="text-sm font-bold text-zinc-900 dark:text-white leading-tight">${esc(m.label)}</div>
          <div class="text-[10px] text-zinc-400 mb-3">${esc(m.sub)}</div>

          <div class="mb-3">
            <div class="text-[10px] uppercase tracking-wider text-zinc-400 font-semibold mb-0.5">Avg calls / user</div>
            <div class="text-2xl font-bold text-zinc-900 dark:text-white tabular-nums">${m.avgPerUser.toFixed(2)}</div>
            <div class="text-[10px] text-zinc-400 mt-0.5">${fmtNum(m.attempts)} attempts · ${fmtNum(m.covered)} reached</div>
          </div>

          <div class="grid grid-cols-2 gap-2 mb-3">
            <div class="flex flex-col items-center gap-1 rounded-lg bg-zinc-50 dark:bg-zinc-800/60 p-2">
              ${ring(m.coverage, m.color, 50)}
              <div class="text-[9px] uppercase tracking-wider text-zinc-500 font-semibold">Coverage</div>
            </div>
            <div class="flex flex-col items-center gap-1 rounded-lg bg-zinc-50 dark:bg-zinc-800/60 p-2">
              ${ring(m.connectivity, m.color, 50)}
              <div class="text-[9px] uppercase tracking-wider text-zinc-500 font-semibold">Connect.</div>
            </div>
          </div>

          <div class="flex items-center gap-2 pt-2 border-t border-zinc-100 dark:border-zinc-800">
            <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="${esc(m.color)}" stroke-width="2"><path d="M3 11l6.5-6.5a3 3 0 014.24 0L21 11M3 11v9a1 1 0 001 1h4v-6h8v6h4a1 1 0 001-1v-9M3 11h18"/><path d="M9 21v-6h6v6"/></svg>
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between gap-1">
                <span class="text-[10px] text-zinc-500 dark:text-zinc-400">Talk time / user</span>
                <span class="text-[11px] font-bold text-zinc-900 dark:text-white tabular-nums">${fmtMins(m.talkPerUser)}</span>
              </div>
              <div class="h-1 mt-1 bg-zinc-100 dark:bg-zinc-800 rounded-full overflow-hidden">
                <div class="h-full rounded-full" style="width:${Math.min(100, m.talkPerUser/Math.max(...M.map(x=>x.talkPerUser), 0.001)*100).toFixed(1)}%;background:${esc(m.color)};"></div>
              </div>
            </div>
          </div>
        </div>`).join('')}
      </div>
    </div>`;

  // ── AI insights ───────────────────────────────────────────────────────────
  const insights = [];
  // Best connectivity stage
  const bestConn = [...M].sort((a,b) => b.connectivity - a.connectivity)[0];
  if (bestConn.connectivity > 0) {
    insights.push({ icon:'⚡', text:`Highest connectivity is in <b>${bestConn.label}</b> at ${bestConn.connectivity.toFixed(1)}%.` });
  }
  // Coverage drop after a stage
  if (M[2].coverage > 0 && M[3].coverage > 0) {
    const drop = M[2].coverage - M[3].coverage;
    if (drop > 5) insights.push({ icon:'📉', text:`Coverage drops <b>${drop.toFixed(0)} pp</b> from 0–7D to 0–14D — follow-up intensity slows past day 7.` });
  }
  // Pre vs total talk time
  const preTalkShare = totalTalkMins > 0 ? (M[0].talkMins / totalTalkMins * 100) : 0;
  if (preTalkShare > 0) {
    insights.push({ icon:'⏱', text:`Pre-webinar calls account for <b>${preTalkShare.toFixed(0)}%</b> of total talk time.` });
  }
  // 0-2D vs 14D+ connectivity ratio
  if (M[1].connectivity > 0 && M[4].connectivity > 0) {
    const ratio = M[1].connectivity / M[4].connectivity;
    if (ratio > 1.5) insights.push({ icon:'🚀', text:`Users contacted within 2 days show <b>${ratio.toFixed(1)}×</b> higher connectivity than long-tail follow-ups.` });
    else if (ratio < 0.7) insights.push({ icon:'📊', text:`Long-tail (14D+) calls connect <b>${(1/ratio).toFixed(1)}×</b> better than 0–2D — late-cycle leads are more receptive.` });
  }
  // Highest avg calls per user
  const intense = [...M].sort((a,b) => b.avgPerUser - a.avgPerUser)[0];
  if (intense.avgPerUser > 0.5) {
    insights.push({ icon:'📞', text:`Most intense outreach is in <b>${intense.label}</b> at ${intense.avgPerUser.toFixed(2)} calls per registered user.` });
  }

  const insightStrip = insights.length ? `
    <div class="mt-6 rounded-2xl bg-gradient-to-br from-indigo-50 to-violet-50 dark:from-indigo-950/40 dark:to-violet-950/40 border border-indigo-100 dark:border-indigo-900/40 p-4">
      <div class="flex items-center gap-1.5 mb-3">
        <svg class="w-3.5 h-3.5 text-indigo-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l1.5 4.5L18 8l-4.5 1.5L12 14l-1.5-4.5L6 8l4.5-1.5L12 2zM5 18l1 2.5L8.5 21l-2.5 1L5 24l-1-2-2.5-1L4 20l1-2zM19 14l1 2.5L22.5 17l-2.5 1L19 20l-1-2-2.5-1L18 16l1-2z"/></svg>
        <span class="text-[10px] uppercase tracking-wider font-bold text-indigo-600 dark:text-indigo-300">Auto Insights</span>
      </div>
      <ul class="space-y-2">
        ${insights.slice(0, 4).map(i => `<li class="flex items-start gap-2 text-xs text-zinc-700 dark:text-zinc-300"><span class="shrink-0">${i.icon}</span><span>${i.text}</span></li>`).join('')}
      </ul>
    </div>` : '';

  return summary + trend + timeline + insightStrip;
}

function renderSalesRevenue(s, ev, isAired) {
  if (!isAired) {
    return `<div class="text-center py-8 text-xs text-zinc-400">Sales &amp; revenue populate after the event airs.</div>`;
  }
  if (!s || (s.sales == null && s.revenue == null && s.overall_roas == null)) {
    return `<div class="text-center py-8 text-xs text-zinc-400">Sales data unavailable for this event.</div>`;
  }

  const sales       = s.sales;
  const revenue     = s.revenue;
  const paidRevenue = s.paid_revenue;
  const overallRoas = s.overall_roas;
  const paidRoas    = s.paid_roas;
  const spend       = s.meta_spend;
  const costPerSale = (spend > 0 && sales > 0) ? spend / sales : null;
  const revPerLead  = (revenue != null && s.total_regs > 0) ? revenue / s.total_regs : null;

  const roasCls = r => r == null ? 'text-zinc-400'
                     : r >= 5 ? 'text-emerald-600 dark:text-emerald-400'
                     : r >= 2 ? 'text-zinc-900 dark:text-white'
                     : 'text-amber-600 dark:text-amber-400';

  // Top KPI strip
  const kpi = `
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
      <div class="rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/50 px-4 py-3">
        <div class="text-[10px] uppercase tracking-wider text-zinc-400 font-semibold">Sales</div>
        <div class="text-2xl font-bold text-zinc-900 dark:text-white tabular-nums mt-1">${sales == null ? '—' : Math.round(sales).toLocaleString()}</div>
        <div class="text-[11px] text-zinc-400 mt-0.5">attributed to this event</div>
      </div>
      <div class="rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/50 px-4 py-3">
        <div class="text-[10px] uppercase tracking-wider text-zinc-400 font-semibold">Revenue</div>
        <div class="text-2xl font-bold text-zinc-900 dark:text-white tabular-nums mt-1">${fmtMoneyAbbr(revenue, ev.country)}</div>
        <div class="text-[11px] text-zinc-400 mt-0.5">${fmtMoney(revenue, moneySym(ev.country))}</div>
      </div>
      <div class="rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/50 px-4 py-3">
        <div class="text-[10px] uppercase tracking-wider text-zinc-400 font-semibold">Overall ROAS</div>
        <div class="text-2xl font-bold tabular-nums mt-1 ${roasCls(overallRoas)}">${fmtROAS(overallRoas)}</div>
        <div class="text-[11px] text-zinc-400 mt-0.5">revenue / paid spend</div>
      </div>
      <div class="rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/50 px-4 py-3">
        <div class="text-[10px] uppercase tracking-wider text-zinc-400 font-semibold">Paid ROAS</div>
        <div class="text-2xl font-bold tabular-nums mt-1 ${roasCls(paidRoas)}">${fmtROAS(paidRoas)}</div>
        <div class="text-[11px] text-zinc-400 mt-0.5">${isUSCountry(ev.country) ? 'YT/L10X channel only' : 'Meta/FB channel only'}</div>
      </div>
    </div>`;

  // Secondary metrics row
  const secondary = `
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
      <div class="rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/50 px-4 py-3">
        <div class="text-[10px] uppercase tracking-wider text-zinc-400 font-semibold">Paid Revenue</div>
        <div class="text-lg font-semibold text-zinc-900 dark:text-white tabular-nums mt-1">${fmtMoneyAbbr(paidRevenue, ev.country)}</div>
        <div class="text-[11px] text-zinc-400 mt-0.5">${revenue > 0 && paidRevenue != null ? (100 * paidRevenue / revenue).toFixed(0) + '% of total' : '—'}</div>
      </div>
      <div class="rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/50 px-4 py-3">
        <div class="text-[10px] uppercase tracking-wider text-zinc-400 font-semibold">Cost / Sale</div>
        <div class="text-lg font-semibold text-zinc-900 dark:text-white tabular-nums mt-1">${costPerSale == null ? '—' : fmtMoney(costPerSale, moneySym(ev.country))}</div>
        <div class="text-[11px] text-zinc-400 mt-0.5">paid spend ÷ sales</div>
      </div>
      <div class="rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/50 px-4 py-3">
        <div class="text-[10px] uppercase tracking-wider text-zinc-400 font-semibold">Revenue / ${leadLabel(ev.country)}</div>
        <div class="text-lg font-semibold text-zinc-900 dark:text-white tabular-nums mt-1">${revPerLead == null ? '—' : fmtMoney(revPerLead, moneySym(ev.country))}</div>
        <div class="text-[11px] text-zinc-400 mt-0.5">revenue ÷ ${leadLabel(ev.country, {long:true})}</div>
      </div>
    </div>`;

  return kpi + secondary;
}

function renderDaily(daily, ev) {
  if (daily.length === 0) return '<div class="text-xs text-zinc-400 italic">No daily snapshots yet.</div>';
  const sym = moneySym(ev && ev.country);
  const isUS = isUSCountry(ev && ev.country);
  const maxRegs = Math.max(...daily.map(d => d.total_regs || 0), 1);

  // For US, history.event_daily stores 3 buckets (meta/crm/other) — the 6-bucket
  // breakdown only lives in event_snapshot. So daily pacing uses the same 3-lane
  // shape for both countries; labels just rename for US (Paid/L10X/Other).
  const lanes = isUS
    ? [
        ['Paid',  d => d.meta_regs  || 0, '#ef4444'],  // YT/Social paid
        ['L10X',  d => d.crm_regs   || 0, '#10b981'],  // L10X Email+Bot
        ['Other', d => d.other_regs || 0, '#a1a1aa'],  // NI Base + Other
      ]
    : [
        ['Meta',   d => d.meta_regs  || 0, '#1877f2'],
        ['CRM',    d => d.crm_regs   || 0, '#10b981'],
        ['Others', d => d.other_regs || 0, '#a1a1aa'],
      ];

  const rows = daily.map(d => {
    const total = d.total_regs || 0;
    const widthOfTotal = total > 0 ? (100 * total / maxRegs) : 0;
    const segs = lanes.map(([label, fn, color]) => {
      const n = fn(d);
      const pctOfDay = total > 0 ? (100 * n / total) : 0;
      return n > 0 ? `<span title="${esc(label)}: ${fmtNum(n)}" style="width:${pctOfDay}%;background:${color};"></span>` : '';
    }).join('');
    return `
      <div class="grid grid-cols-12 items-center gap-2 sm:gap-3 text-xs py-1.5 border-b border-zinc-50 last:border-0">
        <div class="col-span-3 sm:col-span-2 text-zinc-500 whitespace-nowrap">${esc(fmtDate(d.registration_date))}</div>
        <div class="col-span-4 sm:col-span-5">
          <div class="h-2 rounded-full overflow-hidden flex" style="width:${widthOfTotal.toFixed(0)}%;background:rgba(0,0,0,0.04);">${segs}</div>
        </div>
        <div class="col-span-3 sm:col-span-2 text-right font-semibold text-zinc-900 tabular-nums">${fmtNum(total)}</div>
        <div class="hidden sm:block sm:col-span-2 text-right text-zinc-500 tabular-nums">${fmtMoney(d.total_spend, sym)}</div>
        <div class="col-span-2 sm:col-span-1 text-right text-zinc-500 tabular-nums">${d.cpiql != null ? sym + Math.round(d.cpiql) : '—'}</div>
      </div>`;
  }).join('');

  const legend = `
    <div class="flex items-center gap-4 text-[10px] text-zinc-500 mt-3">
      ${lanes.map(([label,, color]) => `<span class="flex items-center gap-1.5"><span class="inline-block w-3 h-2 rounded-sm" style="background:${color};"></span>${esc(label)}</span>`).join('')}
    </div>`;

  return `
    <div class="grid grid-cols-12 gap-2 sm:gap-3 text-[10px] uppercase tracking-wider text-zinc-400 font-semibold pb-2 border-b border-zinc-100">
      <div class="col-span-3 sm:col-span-2">Date</div>
      <div class="col-span-4 sm:col-span-5">Pacing (by channel)</div>
      <div class="col-span-3 sm:col-span-2 text-right">${leadLabel(ev && ev.country, {long:true})}</div>
      <div class="hidden sm:block sm:col-span-2 text-right">Spend</div>
      <div class="col-span-2 sm:col-span-1 text-right">${cplLabel(ev && ev.country)}</div>
    </div>
    ${rows}
    ${legend}
  `;
}

function linkRow(label, value, color, isKey) {
  const href = isKey ? '#' : esc(value);
  const sub  = isKey ? esc(value) : esc(value.replace(/^https?:\/\//, '').slice(0, 60));
  return `
    <a href="${href}" target="_blank" class="link-row flex items-center gap-3 px-3 py-2 rounded-lg no-underline">
      <div class="w-7 h-7 rounded-md bg-${color}-50 flex items-center justify-center">
        <svg class="w-3.5 h-3.5 text-${color}-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      </div>
      <div class="flex-1 min-w-0">
        <div class="text-xs font-medium text-zinc-900">${esc(label)}</div>
        <div class="text-[10px] text-zinc-500 truncate">${sub}</div>
      </div>
      <svg class="w-3.5 h-3.5 text-zinc-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
    </a>`;
}

applyTheme();
checkAuth();
</script>
