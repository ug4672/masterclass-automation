<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event — Masterclass Hub</title>
  <script>tailwind = { config: { darkMode: 'class' } };
    (function() { if ((localStorage.getItem('ik_theme') || 'light') === 'dark') document.documentElement.classList.add('dark'); })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="min-h-screen" id="bodyEl">

<!-- ─── Login overlay ─────────────────────────────────────────────────────── -->
<div id="loginOverlay" class="login-overlay">
  <div class="login-card">
    <div class="login-logo">IK</div>
    <h2 class="login-title">Masterclass Hub</h2>
    <p class="login-sub">Sign in with your IK Google account to continue</p>
    <div id="googleSignInBtn" style="display:flex;justify-content:center;min-height:44px;"></div>
    <p id="loginError" class="login-error"></p>
  </div>
</div>

<div id="appWrap" style="display:none;">

  <!-- ─── Top Bar ──────────────────────────────────────────────────────────── -->
  <header class="sticky top-0 z-40 bg-white/75 backdrop-blur-lg border-b border-zinc-200/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-2 sm:gap-6">
      <a href="/hub.html" class="flex items-center gap-2.5 shrink-0 no-underline">
        <div class="w-8 h-8 rounded-lg bg-zinc-900 flex items-center justify-center"><span class="text-white font-bold text-sm tracking-tight">IK</span></div>
        <div class="hidden sm:block">
          <div class="font-semibold text-zinc-900 text-sm leading-tight">Masterclass Hub</div>
          <div class="text-[10px] text-zinc-500 leading-tight">Interview Kickstart</div>
        </div>
      </a>
      <nav class="flex items-center gap-1 text-sm">
        <a href="/hub.html"     class="px-3 py-1.5 rounded-md text-zinc-500 hover:text-zinc-900 font-medium whitespace-nowrap">Hub</a>
        <a href="/months.html"  class="px-3 py-1.5 rounded-md text-zinc-500 hover:text-zinc-900 font-medium whitespace-nowrap">Months</a>
        <a href="/compare.html" class="px-3 py-1.5 rounded-md text-zinc-500 hover:text-zinc-900 font-medium whitespace-nowrap">Compare</a>
      </nav>
      <div class="flex items-center gap-2 shrink-0">
        <button onclick="toggleTheme()" id="themeToggle" title="Toggle dark mode" class="w-9 h-9 rounded-lg flex items-center justify-center text-zinc-500 hover:bg-zinc-100 dark:hover:bg-zinc-800">
          <svg id="themeIcon" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2m11-11h-2m-18 0H1m17.07-7.07l-1.41 1.41M6.34 17.66l-1.41 1.41m12.73 0l-1.41-1.41M6.34 6.34L4.93 4.93"/></svg>
        </button>
        <button class="w-9 h-9 rounded-full bg-gradient-to-br from-amber-300 via-pink-400 to-fuchsia-500 ring-2 ring-white flex items-center justify-center text-white text-xs font-semibold" id="avatarBtn" onclick="signOut()">UG</button>
      </div>
    </div>
  </header>

  <main id="mainArea" class="max-w-7xl mx-auto px-4 sm:px-6 pt-4 pb-12">
    <!-- Breadcrumb shows up once the event loads; the load() function rewrites this whole area. -->
    <div id="loadingState" class="text-center text-zinc-400 text-sm p-12">Loading event…</div>
  </main>

  <footer class="border-t border-zinc-200/80 bg-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-5 flex items-center justify-between text-xs text-zinc-500">
      <div>© 2026 Interview Kickstart · Internal use</div>
      <div><a href="/hub.html" class="hover:text-zinc-900">Back to Hub</a></div>
    </div>
  </footer>
</div>

<script>
'use strict';

const GOOGLE_CLIENT_ID = '801560849080-lgdgif7rjbgap4fqqp0cbcj7duc2ed0o.apps.googleusercontent.com';
const TOPIC_VAR = {
  ai_agents: '--topic-ai', system_design: '--topic-system', behavioral: '--topic-behavioral',
  data: '--topic-data', ml: '--topic-ml', distributed: '--topic-distributed',
};
const TOPIC_LABEL = {
  ai_agents: 'AI & Agents', system_design: 'System Design', behavioral: 'Behavioral',
  data: 'Data', ml: 'ML Eng', distributed: 'Distributed',
};

// ── Theme ───────────────────────────────────────────────────────────────────
const SUN_ICON  = '<svg id="themeIcon" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2m11-11h-2m-18 0H1m17.07-7.07l-1.41 1.41M6.34 17.66l-1.41 1.41m12.73 0l-1.41-1.41M6.34 6.34L4.93 4.93"/></svg>';
const MOON_ICON = '<svg id="themeIcon" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
function applyTheme() {
  const dark = document.documentElement.classList.contains('dark');
  const btn  = document.getElementById('themeToggle');
  if (btn) btn.innerHTML = dark ? SUN_ICON : MOON_ICON;
}
function toggleTheme() {
  const dark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('ik_theme', dark ? 'dark' : 'light');
  applyTheme();
}

// ── Auth ────────────────────────────────────────────────────────────────────
function showApp(email) {
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('appWrap').style.display = '';
  if (email) document.getElementById('avatarBtn').textContent = (email[0] || '?').toUpperCase() + (email.split('.')[1]?.[0] || '').toUpperCase();
  load();
}
function showLogin() {
  document.getElementById('loginOverlay').style.display = 'flex';
  document.getElementById('appWrap').style.display = 'none';
}
async function checkAuth() {
  try { const r = await fetch('/auth/check'); if (r.ok) { const d = await r.json(); showApp(d.email); } else showLogin(); }
  catch { showLogin(); }
}
async function handleGoogleSignIn(response) {
  const err = document.getElementById('loginError'); err.style.display = 'none';
  try {
    const r = await fetch('/auth/verify', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({credential: response.credential}) });
    const d = await r.json();
    if (r.ok) showApp(d.email);
    else { err.textContent = d.error || 'Sign-in failed.'; err.style.display = 'block'; }
  } catch { err.textContent = 'Sign-in failed.'; err.style.display = 'block'; }
}
async function signOut() { await fetch('/auth/logout', { method: 'POST' }); showLogin(); }
window.onGoogleLibraryLoad = function () {
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleGoogleSignIn, hd: 'interviewkickstart.com' });
  google.accounts.id.renderButton(document.getElementById('googleSignInBtn'), { theme: 'outline', size: 'large', width: 280 });
};

// ── Helpers ─────────────────────────────────────────────────────────────────
function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(iso) { return iso ? new Date(iso).toLocaleDateString('en-US', { month:'short', day:'numeric' }) : '—'; }
function fmtDateTime(iso) { return iso ? new Date(iso).toLocaleString('en-US', { weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit', timeZone:'Asia/Kolkata' }) + ' IST' : '—'; }
function fmtCountdown(iso) {
  if (!iso) return '—';
  const diffMs = new Date(iso) - new Date();
  if (diffMs < 0) {
    const h = Math.round(-diffMs / 3600000);
    return h < 24 ? `Aired ${h}h ago` : `Aired ${Math.round(h/24)}d ago`;
  }
  const h = diffMs / 3600000;
  if (h < 24) return `Live in ${Math.floor(h)}h ${Math.round((h % 1) * 60)}m`;
  return `In ${Math.floor(h/24)} days`;
}
function fmtNum(n) { if (n == null) return '—'; if (n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,'') + 'k'; return Math.round(n).toLocaleString(); }
function fmtMoney(n, sym) { return n == null ? '—' : (sym || '₹') + Math.round(n).toLocaleString(); }
function isUSCountry(c) { const s = (c || '').toLowerCase(); return s === 'us' || s === 'usa'; }
function leadLabel(c, opts) {
  // India tracks IQLs; US tracks GQLs. CPIQL / CPGQL likewise.
  return isUSCountry(c) ? (opts?.long ? 'GQLs' : 'GQL') : (opts?.long ? 'IQLs' : 'IQL');
}
function cplLabel(c) { return isUSCountry(c) ? 'CPGQL' : 'CPIQL'; }
function moneySym(c) { return isUSCountry(c) ? '$' : '₹'; }
function fmtPct(n)   { return n == null ? '—' : n.toFixed(1) + '%'; }
function initials(name) { return name ? name.split(/\s+/).filter(Boolean).map(s => s[0]).slice(0,2).join('').toUpperCase() : 'IK'; }
function topicVar(t)   { return TOPIC_VAR[t]   || '--topic-ai'; }
function topicLabel(t) { return TOPIC_LABEL[t] || 'General'; }

// ── Data ────────────────────────────────────────────────────────────────────
function getEventId() {
  return new URLSearchParams(window.location.search).get('id') || '';
}

async function exportPollQna(eventId) {
  const btn = document.getElementById('pollReportBtn');
  const lbl = document.getElementById('pollReportLbl');
  if (!btn || btn.disabled) return;
  btn.disabled = true;
  const original = lbl.textContent;
  lbl.textContent = 'Building sheet…';
  btn.classList.add('opacity-60');
  try {
    const r = await fetch(`/event/poll-qna-export?event_id=${encodeURIComponent(eventId)}`);
    const d = await r.json();
    if (!r.ok || !d.spreadsheet_url) throw new Error(d.error || 'Failed to build sheet');
    window.open(d.spreadsheet_url, '_blank', 'noopener');
    lbl.textContent = `Opened (${d.poll_rows} polls · ${d.qna_rows} Q&A)`;
    setTimeout(() => { lbl.textContent = original; btn.disabled = false; btn.classList.remove('opacity-60'); }, 4000);
  } catch (e) {
    lbl.textContent = 'Failed: ' + e.message;
    btn.classList.remove('opacity-60');
    btn.classList.add('text-rose-600');
    setTimeout(() => { lbl.textContent = original; btn.disabled = false; btn.classList.remove('text-rose-600'); }, 5000);
  }
}

async function load() {
  const id = getEventId();
  if (!id) {
    document.getElementById('mainArea').innerHTML = '<div class="p-12 text-center text-rose-600">Missing event id. <a href="/hub.html" class="underline">Back to Hub</a></div>';
    return;
  }
  try {
    const r = await fetch(`/events/${encodeURIComponent(id)}`);
    if (r.status === 404) { document.getElementById('mainArea').innerHTML = '<div class="p-12 text-center text-zinc-500">Event not found. <a href="/hub.html" class="underline">Back to Hub</a></div>'; return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    render(d);
  } catch (e) {
    document.getElementById('mainArea').innerHTML = `<div class="p-12 text-center text-rose-600">Failed to load: ${esc(e.message)}</div>`;
  }
}

function render(data) {
  const ev   = data.event || {};
  const snap = data.snapshot || {};
  const daily = data.daily || [];
  // Topic color theme
  document.getElementById('bodyEl').style.setProperty('--topic', `var(${topicVar(ev.topic)})`);
  document.title = (ev.title || 'Event') + ' — Masterclass Hub';

  const totalRegs = snap.total_regs;
  const goalP = (totalRegs != null && ev.goal_regs > 0) ? Math.min(100, 100 * totalRegs / ev.goal_regs) : null;
  const isAired = snap.hours_to_live != null && snap.hours_to_live < 0;
  const isUrgent = snap.hours_to_live != null && snap.hours_to_live < 24 && snap.hours_to_live > -4;

  const monthSlug = ev.live_at ? new Date(ev.live_at).toISOString().slice(0, 7) : null;
  const monthLabel = ev.live_at ? new Date(ev.live_at).toLocaleString('en-US', { month: 'short', year: 'numeric' }) : null;

  document.getElementById('mainArea').innerHTML = `
    <!-- Breadcrumb -->
    <nav class="flex items-center gap-1.5 text-xs text-zinc-500 mb-4 flex-wrap">
      <a href="/hub.html" class="hover:text-zinc-900">Hub</a>
      ${monthSlug ? `<span class="text-zinc-300">/</span><a href="/months.html?month=${monthSlug}&country=${encodeURIComponent(ev.country || '')}" class="hover:text-zinc-900">${esc(monthLabel)}</a>` : ''}
      <span class="text-zinc-300">/</span>
      <span class="text-zinc-900 font-medium truncate">${esc(ev.title || ev.event_id)}</span>
    </nav>

    <!-- HERO -->
    <article class="card rounded-2xl p-5 sm:p-7 topic-glow fade-up">
      <div class="absolute top-0 left-5 right-5 sm:left-7 sm:right-7 h-0.5 topic-strip rounded-b-full"></div>
      <div class="flex flex-col md:flex-row items-start md:justify-between gap-4 md:gap-6">
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 mb-3 flex-wrap">
            <span class="w-2 h-2 rounded-full ${isUrgent ? 'bg-rose-500 animate-pulse' : 'bg-zinc-300'}"></span>
            <span class="text-[11px] uppercase tracking-wider font-semibold ${isUrgent ? 'text-rose-600' : 'text-zinc-500'}">${esc(fmtCountdown(ev.live_at))}</span>
            <span class="text-zinc-300">·</span>
            <span class="topic-chip text-[10px] uppercase tracking-wider font-semibold px-2.5 py-1 rounded-full">${esc(topicLabel(ev.topic))}</span>
            <span class="text-zinc-300">·</span>
            <span class="text-[11px] uppercase tracking-wider font-semibold text-zinc-500">${esc(ev.country || '—')}</span>
          </div>
          <h1 class="text-3xl md:text-[2.1rem] font-semibold leading-[1.15] text-zinc-900 tracking-tight max-w-3xl">${esc(ev.title || '—')}</h1>
          ${ev.summary ? `<p class="mt-3 text-zinc-600 text-sm leading-relaxed max-w-2xl">${esc(ev.summary)}</p>` : ''}
          <div class="flex items-center gap-3 mt-6">
            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-indigo-400 via-violet-500 to-fuchsia-500 ring-2 ring-white flex items-center justify-center text-white text-sm font-semibold">${esc(initials(ev.instructor_name))}</div>
            <div>
              <div class="text-sm font-semibold text-zinc-900">${esc(ev.instructor_name || '—')}</div>
              <div class="text-xs text-zinc-500">${esc(ev.instructor_role || '')}</div>
            </div>
          </div>
        </div>
        <div class="flex flex-row md:flex-col items-start md:items-end justify-between gap-3 shrink-0 w-full md:w-auto">
          <div class="flex items-center gap-2 flex-wrap">
            ${ev.zoom_url ? `<a href="${esc(ev.zoom_url)}" target="_blank" class="px-3.5 py-2 bg-zinc-900 text-white rounded-lg text-xs font-semibold hover:bg-zinc-800 transition flex items-center gap-1.5 no-underline">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              Join Zoom
            </a>` : ''}
            ${ev.landing_url ? `<a href="${esc(ev.landing_url)}" target="_blank" class="px-3.5 py-2 bg-white border border-zinc-200 rounded-lg text-xs font-medium text-zinc-700 hover:bg-zinc-50 transition flex items-center gap-1.5 no-underline">Landing ↗</a>` : ''}
            ${isAired ? `<button id="pollReportBtn" onclick="exportPollQna('${esc(ev.event_id)}')" class="px-3.5 py-2 bg-white border border-zinc-200 rounded-lg text-xs font-medium text-zinc-700 hover:bg-zinc-50 transition flex items-center gap-1.5">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              <span id="pollReportLbl">Poll & Q&A Report</span>
            </button>` : ''}
          </div>
          <div class="text-right">
            <div class="text-[10px] uppercase tracking-wider text-zinc-500 font-semibold">${isAired ? 'Aired on' : 'Goes live'}</div>
            <div class="text-sm font-semibold text-zinc-900 mt-0.5">${esc(fmtDateTime(ev.live_at))}</div>
          </div>
        </div>
      </div>
    </article>

    <!-- KPI strip -->
    <section class="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-4 fade-up">
      <div class="bg-white border border-zinc-200 rounded-xl p-4">
        <div class="text-[11px] text-zinc-500 font-medium uppercase tracking-wide">${isAired ? 'Final ' + leadLabel(ev.country, {long:true}) : leadLabel(ev.country, {long:true}) + ' registered'}</div>
        <div class="mt-2 flex items-baseline gap-1.5">
          <div class="text-2xl font-semibold text-zinc-900">${fmtNum(totalRegs)}</div>
          ${ev.goal_regs ? `<div class="text-xs text-zinc-500 font-medium">/ ${fmtNum(ev.goal_regs)} goal</div>` : ''}
        </div>
        ${goalP != null ? `<div class="mt-3 h-1 progress-track rounded-full overflow-hidden"><div class="topic-fill h-full rounded-full" style="width: ${goalP.toFixed(0)}%;"></div></div>` : ''}
      </div>
      <div class="bg-white border border-zinc-200 rounded-xl p-4">
        <div class="text-[11px] text-zinc-500 font-medium uppercase tracking-wide">${cplLabel(ev.country)}</div>
        <div class="mt-2 text-2xl font-semibold text-zinc-900">${fmtMoney(snap.cpiql, moneySym(ev.country))}</div>
        <div class="text-[10px] text-zinc-500 mt-1.5">Spend ${fmtMoney(snap.meta_spend, moneySym(ev.country))} · ${fmtNum(snap.meta_regs)} paid ${leadLabel(ev.country, {long:true})}</div>
      </div>
      <div class="bg-white border border-zinc-200 rounded-xl p-4">
        <div class="text-[11px] text-zinc-500 font-medium uppercase tracking-wide">${isAired ? 'Attendance' : 'Time to live'}</div>
        <div class="mt-2 text-2xl font-semibold text-zinc-900">${isAired ? fmtPct(snap.attendance_pct) : esc(fmtCountdown(ev.live_at))}</div>
        ${isAired ? `<div class="text-[10px] text-zinc-500 mt-1.5">${fmtNum(snap.attendees)} of ${fmtNum(totalRegs)} attended</div>` : ''}
      </div>
    </section>

    <!-- Two-column main -->
    <section class="grid grid-cols-12 gap-4 mt-4">

      <!-- LEFT (8 cols) -->
      <div class="col-span-12 lg:col-span-8 space-y-4">

        <!-- Lead funnel -->
        <article class="card rounded-2xl p-6 fade-up topic-glow">
          <div class="absolute top-0 left-6 right-6 h-0.5 topic-strip rounded-b-full"></div>
          <h2 class="text-sm font-semibold text-zinc-900 tracking-tight">Lead Funnel</h2>
          <p class="text-xs text-zinc-500 mt-0.5 mb-5">Channel split · cumulative through ${esc(fmtDateTime(snap.snapshot_at))}</p>
          ${renderFunnel(snap, ev)}
        </article>

        <!-- Lead quality -->
        <article class="card rounded-2xl p-6 fade-up">
          <h2 class="text-sm font-semibold text-zinc-900 tracking-tight">Lead Quality</h2>
          <p class="text-xs text-zinc-500 mt-0.5 mb-5">Role category · work experience</p>
          ${renderQuality(snap)}
        </article>

        <!-- Attendance -->
        <article class="card rounded-2xl p-6 fade-up">
          <div class="flex items-start justify-between mb-4">
            <div>
              <h2 class="text-sm font-semibold text-zinc-900 dark:text-white tracking-tight">Attendance &amp; Engagement</h2>
              <p class="text-xs text-zinc-500 mt-0.5">${isAired ? 'Post-event metrics' : 'Populates after the event goes live'}</p>
            </div>
            ${!isAired ? `<span class="text-[10px] uppercase tracking-wider font-semibold text-zinc-400 px-2 py-1 rounded-full bg-zinc-100 dark:bg-zinc-800">Not yet aired</span>` : ''}
          </div>
          ${renderAttendance(snap, isAired)}
        </article>

        <!-- Call Efforts -->
        <article class="card rounded-2xl p-6 fade-up">
          <div class="flex items-start justify-between mb-5">
            <div>
              <h2 class="text-sm font-semibold text-zinc-900 dark:text-white tracking-tight">Call Efforts</h2>
              <p class="text-xs text-zinc-500 mt-0.5">Lifecycle engagement · Pre webinar → 14D+ post</p>
            </div>
            ${!isAired ? `<span class="text-[10px] uppercase tracking-wider font-semibold text-zinc-400 px-2 py-1 rounded-full bg-zinc-100 dark:bg-zinc-800">Not yet aired</span>` : ''}
          </div>
          ${renderCallEfforts(snap, isAired)}
        </article>

        <!-- Per-day timeline -->
        <article class="card rounded-2xl p-6 fade-up">
          <h2 class="text-sm font-semibold text-zinc-900 tracking-tight">Daily pacing</h2>
          <p class="text-xs text-zinc-500 mt-0.5 mb-5">${daily.length} day${daily.length===1?'':'s'} of acquisition</p>
          ${renderDaily(daily, ev)}
        </article>
      </div>

      <!-- RIGHT (4 cols) -->
      <div class="col-span-12 lg:col-span-4 space-y-4">
        <!-- Event details -->
        <article class="card rounded-2xl p-5 fade-up">
          <h3 class="text-xs font-semibold text-zinc-900 uppercase tracking-wider mb-3">Event details</h3>
          <dl class="space-y-2.5 text-xs">
            <div class="flex items-baseline justify-between gap-3"><dt class="text-zinc-500">Type</dt><dd class="font-medium text-zinc-900">${esc(ev.event_type || '—')}</dd></div>
            <div class="flex items-baseline justify-between gap-3"><dt class="text-zinc-500">Webinar type</dt><dd class="font-mono text-[10px] text-zinc-700">${esc(ev.webinar_type || '—')}</dd></div>
            <div class="flex items-baseline justify-between gap-3"><dt class="text-zinc-500">${isAired ? 'Aired on' : 'Goes live'}</dt><dd class="font-medium text-zinc-900 text-right">${esc(fmtDateTime(ev.live_at))}</dd></div>
            ${ev.day2_live_at ? `<div class="flex items-baseline justify-between gap-3"><dt class="text-zinc-500">Day 2</dt><dd class="font-medium text-zinc-900 text-right">${esc(fmtDateTime(ev.day2_live_at))}</dd></div>` : ''}
            <div class="flex items-baseline justify-between gap-3"><dt class="text-zinc-500">Go-live date</dt><dd class="font-medium text-zinc-900">${esc(fmtDate(ev.go_live_date))}</dd></div>
            <div class="flex items-baseline justify-between gap-3"><dt class="text-zinc-500">Country</dt><dd class="font-medium text-zinc-900">${esc(ev.country || '—')}</dd></div>
            <div class="flex items-baseline justify-between gap-3"><dt class="text-zinc-500">Created by</dt><dd class="font-medium text-zinc-900 truncate">${esc(ev.created_by || '—')}</dd></div>

  `;
}

// ── Section renderers ──────────────────────────────────────────────────────
function renderFunnel(s, ev) {
  const sym = moneySym(ev && ev.country);
  const lead = leadLabel(ev && ev.country, {long:true});
  const lanes = isUSCountry(ev && ev.country)
    ? [
        // US: 6 channel buckets from utm_campaign classification.
        ['YT',         s.us_yt_regs         || 0, '#ef4444'],
        ['Social',     s.us_social_regs     || 0, '#1877f2'],
        ['L10X Email', s.us_l10x_email_regs || 0, '#10b981'],
        ['L10X Bot',   s.us_l10x_bot_regs   || 0, '#8b5cf6'],
        ['NI Base',    s.us_ni_base_regs    || 0, '#f59e0b'],
        ['Other',      s.us_other_regs      || 0, '#a1a1aa'],
      ]
    : [
        ['Meta',   s.meta_regs  || 0, '#1877f2'],
        ['CRM',    s.crm_regs   || 0, '#10b981'],
        ['Others', s.other_regs || 0, '#a1a1aa'],
      ];
  const total = lanes.reduce((a, [, n]) => a + n, 0);
  if (total === 0) return '<div class="text-xs text-zinc-400 italic py-4">No registration data yet.</div>';
  const w = n => total > 0 ? (100 * n / total) : 0;
  const cplPaid  = (s.meta_spend > 0 && s.meta_regs > 0)
    ? sym + Math.round(s.meta_spend / s.meta_regs) : '—';
  const rows = lanes.map(([label, n, color], i) => {
    // CPL annotation only on the "paid" lane; rest read "organic".
    const isPaidLane = isUSCountry(ev && ev.country)
      ? (label === 'YT' || label === 'Social')
      : (label === 'Meta');
    const annot = isPaidLane ? cplPaid : 'organic';
    return `
      <div class="funnel-row">
        <div class="flex items-center gap-2 text-xs"><span class="w-2 h-2 rounded-sm" style="background:${color};"></span><span class="font-medium text-zinc-900">${esc(label)}</span></div>
        <div class="funnel-bar"><span style="width: ${w(n)}%; background:${color};"></span></div>
        <div class="text-sm font-semibold text-zinc-900 text-right">${fmtNum(n)}</div>
        <div class="text-[10px] text-zinc-500 text-right">${annot}</div>
      </div>`;
  }).join('');
  return `
    <div class="space-y-2.5">${rows}</div>
    <div class="mt-5 pt-4 border-t border-zinc-100 text-xs text-zinc-500">
      <span class="font-semibold text-zinc-900">${fmtNum(total)}</span> total ${lead} · paid spend ${fmtMoney(s.meta_spend, sym)}
    </div>
  `;
}

function renderQuality(s) {
  // Bucket labels match the legacy Leads section. role_ml stores "Data";
  // we_3_5 stores "0-5" — column names are misleading but kept for back-compat.
  const roleBuckets = [
    ['Data',              s.role_ml         || 0],
    ['Software Engineer', s.role_sde        || 0],
    ['Management',        s.role_management || 0],
    ['Systems',           s.role_systems    || 0],
    ['Null',              s.role_null       || 0],
    ['Other',             s.role_other      || 0],
  ];
  const weBuckets = [
    ['0–5 years',   s.we_3_5    || 0],
    ['5–10 years',  s.we_6_10   || 0],
    ['10–15 years', s.we_10_15  || 0],
    ['15–20 years', s.we_15_20  || 0],
    ['20+ years',   s.we_20p    || 0],
    ['Other',       s.we_other  || 0],
  ];
  const roleTotal = roleBuckets.reduce((a, [, n]) => a + n, 0);
  const weTotal   = weBuckets.reduce((a, [, n]) => a + n, 0);
  if (roleTotal === 0 && weTotal === 0) return '<div class="text-xs text-zinc-400 italic">Cohort breakdown not yet snapshotted.</div>';
  const bar = (label, val, total) => {
    const pct = total > 0 ? (100 * val / total) : 0;
    return `
    <div class="flex items-center justify-between text-xs gap-3">
      <span class="text-zinc-700 truncate">${esc(label)}</span>
      <div class="flex items-center gap-2 shrink-0">
        <div class="w-24 h-1.5 progress-track rounded-full overflow-hidden">
          <div class="topic-fill h-full" style="width: ${pct.toFixed(0)}%;"></div>
        </div>
        <span class="font-semibold text-zinc-900 w-12 text-right tabular-nums">${pct.toFixed(1)}%</span>
      </div>
    </div>`;
  };
  // Hide empty buckets (Null role and 0-5 work_ex are usually 0).
  // Percentages stay relative to the full total so they remain accurate.
  const roleVisible = roleBuckets.filter(([, n]) => n > 0);
  const weVisible   = weBuckets.filter(([, n]) => n > 0);
  return `
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div>
        <div class="text-[10px] uppercase tracking-wider text-zinc-500 font-semibold mb-3">Role category</div>
        <div class="space-y-2">
          ${roleVisible.map(([l, n]) => bar(l, n, roleTotal)).join('')}
        </div>
      </div>
      <div>
        <div class="text-[10px] uppercase tracking-wider text-zinc-500 font-semibold mb-3">Work experience</div>
        <div class="space-y-2">
          ${weVisible.map(([l, n]) => bar(l, n, weTotal)).join('')}
        </div>
      </div>
    </div>`;
}

// ── Call Efforts — full lifecycle dashboard (5 stages, summary, trends, insights)
function renderCallEfforts(s, isAired) {
  if (!isAired) {
    return `<div class="text-center py-8 text-xs text-zinc-400">Call efforts populate after the event airs.</div>`;
  }
  if (!s || !s.call_total_leads) {
    return `<div class="text-center py-8 text-xs text-zinc-400">Call lifecycle data unavailable for this event.</div>`;
  }

  const totalLeads = s.call_total_leads || 0;
  const safe = v => (v == null || isNaN(v)) ? 0 : v;

  const STAGES = [
    { key:'pre',  label:'Pre Webinar', sub:'Before event',   color:'#6366f1' },
    { key:'p2',   label:'0–2 Days',    sub:'First 48 hours', color:'#8b5cf6' },
    { key:'p7',   label:'0–7 Days',    sub:'First week',     color:'#ec4899' },
    { key:'p14',  label:'0–14 Days',   sub:'First 2 weeks',  color:'#f59e0b' },
    { key:'p14p', label:'14D+',        sub:'Long tail',      color:'#10b981' },
  ];

  const M = STAGES.map(st => {
    const k = st.key;
    const attempts = safe(s[`call_${k}_attempts`]);
    const connects = safe(s[`call_${k}_connects`]);
    const talkMins = safe(s[`call_${k}_talk_mins`]);
    const covered  = safe(s[`call_${k}_covered`]);
    return {
      ...st, attempts, connects, talkMins, covered,
      avgPerUser:   totalLeads > 0 ? attempts / totalLeads : 0,
      coverage:     totalLeads > 0 ? covered / totalLeads * 100 : 0,
      connectivity: attempts > 0 ? connects / attempts * 100 : 0,
      talkPerUser:  totalLeads > 0 ? talkMins / totalLeads : 0,
    };
  });

  // Aggregate non-overlapping totals: pre + p_14d (covers post 0–14D inclusive) + p_14p (14+)
  const SUM_IDX = [0, 3, 4];
  const totalAttempts = SUM_IDX.reduce((a,i) => a + M[i].attempts, 0);
  const totalConnects = SUM_IDX.reduce((a,i) => a + M[i].connects, 0);
  const totalTalkMins = SUM_IDX.reduce((a,i) => a + M[i].talkMins, 0);
  const overallCoverage     = Math.max(...M.map(m => m.coverage));
  const overallConnectivity = totalAttempts > 0 ? (totalConnects / totalAttempts * 100) : 0;

  // ── Helpers ────────────────────────────────────────────────────────────────
  const ring = (pct, color, size=58) => {
    const r = size/2 - 5;
    const c = 2*Math.PI*r;
    const dash = Math.min(100, Math.max(0, pct)) / 100 * c;
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="shrink-0">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(0,0,0,.07)" stroke-width="4" class="dark:[stroke:rgba(255,255,255,.08)]"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${esc(color)}" stroke-width="4"
              stroke-dasharray="${dash.toFixed(1)} ${c.toFixed(1)}" stroke-linecap="round"
              transform="rotate(-90 ${size/2} ${size/2})"/>
      <text x="${size/2}" y="${size/2}" text-anchor="middle" dominant-baseline="central"
            fill="${esc(color)}" font-size="11" font-weight="700" font-family="Inter,sans-serif">${pct.toFixed(0)}%</text>
    </svg>`;
  };

  const fmtMins = m => {
    if (m == null || m === 0) return '0 mins';
    if (m < 1) return (m*60).toFixed(0) + ' sec';
    return m.toFixed(1) + ' mins';
  };
  const fmtTotalMins = m => {
    if (m == null) return '—';
    if (m >= 60) return (m/60).toFixed(1) + ' hrs';
    return Math.round(m) + ' mins';
  };

  // ── Executive summary strip ────────────────────────────────────────────────
  const summary = `
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
      <div class="rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/50 px-4 py-3">
        <div class="text-[10px] uppercase tracking-wider text-zinc-400 font-semibold">Total Calls Made</div>
        <div class="text-2xl font-bold text-zinc-900 dark:text-white tabular-nums mt-1">${fmtNum(totalAttempts)}</div>
        <div class="text-[11px] text-zinc-400 mt-0.5">across all stages</div>
      </div>
      <div class="rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/50 px-4 py-3">
        <div class="text-[10px] uppercase tracking-wider text-zinc-400 font-semibold">Overall Coverage</div>
        <div class="text-2xl font-bold text-zinc-900 dark:text-white tabular-nums mt-1">${overallCoverage.toFixed(1)}%</div>
        <div class="text-[11px] text-zinc-400 mt-0.5">of ${fmtNum(totalLeads)} registered users</div>
      </div>
      <div class="rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/50 px-4 py-3">
        <div class="text-[10px] uppercase tracking-wider text-zinc-400 font-semibold">Overall Connectivity</div>
        <div class="text-2xl font-bold text-zinc-900 dark:text-white tabular-nums mt-1">${overallConnectivity.toFixed(1)}%</div>
        <div class="text-[11px] text-zinc-400 mt-0.5">of all call attempts</div>
      </div>
      <div class="rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/50 px-4 py-3">
        <div class="text-[10px] uppercase tracking-wider text-zinc-400 font-semibold">Total Talk Time</div>
        <div class="text-2xl font-bold text-zinc-900 dark:text-white tabular-nums mt-1">${fmtTotalMins(totalTalkMins)}</div>
        <div class="text-[11px] text-zinc-400 mt-0.5">connected calls only</div>
      </div>
    </div>`;

  // ── Trend layer: bar chart for Avg Calls/User + Connectivity ──────────────
  const bars = (vals, color, fmt) => {
    const max = Math.max(...vals, 0.001);
    return STAGES.map((st, i) => {
      const v = vals[i];
      const w = Math.max(2, (v / max) * 100);
      return `<div class="flex items-center gap-2 text-[11px]">
        <span class="w-16 sm:w-20 text-zinc-500 dark:text-zinc-400 shrink-0">${esc(st.label)}</span>
        <div class="flex-1 h-1.5 bg-zinc-100 dark:bg-zinc-800 rounded-full overflow-hidden">
          <div class="h-full rounded-full" style="width:${w.toFixed(1)}%;background:${esc(color)};"></div>
        </div>
        <span class="w-12 text-right font-semibold text-zinc-900 dark:text-white tabular-nums">${fmt(v)}</span>
      </div>`;
    }).join('');
  };

  const trend = `
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-3 mb-6">
      <div class="rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/50 p-4">
        <div class="text-[10px] uppercase tracking-wider text-zinc-400 font-semibold mb-3">Avg Calls / User by stage</div>
        <div class="space-y-2">${bars(M.map(m=>m.avgPerUser), '#6366f1', v => v.toFixed(2))}</div>
      </div>
      <div class="rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/50 p-4">
        <div class="text-[10px] uppercase tracking-wider text-zinc-400 font-semibold mb-3">Connectivity % by stage</div>
        <div class="space-y-2">${bars(M.map(m=>m.connectivity), '#10b981', v => v.toFixed(1)+'%')}</div>
      </div>
    </div>`;

  // ── Stage timeline cards ──────────────────────────────────────────────────
  const timeline = `
    <div class="relative">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 relative">
        ${M.map((m, i) => `
        <div class="relative rounded-2xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/60 p-4 hover:shadow-lg hover:-translate-y-0.5 transition-all">
          <div class="absolute top-0 left-0 right-0 h-0.5 rounded-t-2xl" style="background:linear-gradient(90deg, ${esc(m.color)} 0%, ${esc(m.color)}88 100%);"></div>
          <div class="flex items-center justify-between mb-1">
            <div class="text-[10px] uppercase tracking-wider font-bold" style="color:${esc(m.color)};">Stage ${i+1}</div>
            ${i<M.length-1 ? `<svg class="w-3 h-3 text-zinc-300 dark:text-zinc-700 hidden lg:block absolute -right-2.5 top-1/2 -translate-y-1/2 z-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>` : ''}
          </div>
          <div class="text-sm font-bold text-zinc-900 dark:text-white leading-tight">${esc(m.label)}</div>
          <div class="text-[10px] text-zinc-400 mb-3">${esc(m.sub)}</div>

          <div class="mb-3">
            <div class="text-[10px] uppercase tracking-wider text-zinc-400 font-semibold mb-0.5">Avg calls / user</div>
            <div class="text-2xl font-bold text-zinc-900 dark:text-white tabular-nums">${m.avgPerUser.toFixed(2)}</div>
            <div class="text-[10px] text-zinc-400 mt-0.5">${fmtNum(m.attempts)} attempts · ${fmtNum(m.covered)} reached</div>
          </div>

          <div class="grid grid-cols-2 gap-2 mb-3">
            <div class="flex flex-col items-center gap-1 rounded-lg bg-zinc-50 dark:bg-zinc-800/60 p-2">
              ${ring(m.coverage, m.color, 50)}
              <div class="text-[9px] uppercase tracking-wider text-zinc-500 font-semibold">Coverage</div>
            </div>
            <div class="flex flex-col items-center gap-1 rounded-lg bg-zinc-50 dark:bg-zinc-800/60 p-2">
              ${ring(m.connectivity, m.color, 50)}
              <div class="text-[9px] uppercase tracking-wider text-zinc-500 font-semibold">Connect.</div>
            </div>
          </div>

          <div class="flex items-center gap-2 pt-2 border-t border-zinc-100 dark:border-zinc-800">
            <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="${esc(m.color)}" stroke-width="2"><path d="M3 11l6.5-6.5a3 3 0 014.24 0L21 11M3 11v9a1 1 0 001 1h4v-6h8v6h4a1 1 0 001-1v-9M3 11h18"/><path d="M9 21v-6h6v6"/></svg>
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between gap-1">
                <span class="text-[10px] text-zinc-500 dark:text-zinc-400">Talk time / user</span>
                <span class="text-[11px] font-bold text-zinc-900 dark:text-white tabular-nums">${fmtMins(m.talkPerUser)}</span>
              </div>
              <div class="h-1 mt-1 bg-zinc-100 dark:bg-zinc-800 rounded-full overflow-hidden">
                <div class="h-full rounded-full" style="width:${Math.min(100, m.talkPerUser/Math.max(...M.map(x=>x.talkPerUser), 0.001)*100).toFixed(1)}%;background:${esc(m.color)};"></div>
              </div>
            </div>
          </div>
        </div>`).join('')}
      </div>
    </div>`;

  // ── AI insights ───────────────────────────────────────────────────────────
  const insights = [];
  // Best connectivity stage
  const bestConn = [...M].sort((a,b) => b.connectivity - a.connectivity)[0];
  if (bestConn.connectivity > 0) {
    insights.push({ icon:'⚡', text:`Highest connectivity is in <b>${bestConn.label}</b> at ${bestConn.connectivity.toFixed(1)}%.` });
  }
  // Coverage drop after a stage
  if (M[2].coverage > 0 && M[3].coverage > 0) {
    const drop = M[2].coverage - M[3].coverage;
    if (drop > 5) insights.push({ icon:'📉', text:`Coverage drops <b>${drop.toFixed(0)} pp</b> from 0–7D to 0–14D — follow-up intensity slows past day 7.` });
  }
  // Pre vs total talk time
  const preTalkShare = totalTalkMins > 0 ? (M[0].talkMins / totalTalkMins * 100) : 0;
  if (preTalkShare > 0) {
    insights.push({ icon:'⏱', text:`Pre-webinar calls account for <b>${preTalkShare.toFixed(0)}%</b> of total talk time.` });
  }
  // 0-2D vs 14D+ connectivity ratio
  if (M[1].connectivity > 0 && M[4].connectivity > 0) {
    const ratio = M[1].connectivity / M[4].connectivity;
    if (ratio > 1.5) insights.push({ icon:'🚀', text:`Users contacted within 2 days show <b>${ratio.toFixed(1)}×</b> higher connectivity than long-tail follow-ups.` });
    else if (ratio < 0.7) insights.push({ icon:'📊', text:`Long-tail (14D+) calls connect <b>${(1/ratio).toFixed(1)}×</b> better than 0–2D — late-cycle leads are more receptive.` });
  }
  // Highest avg calls per user
  const intense = [...M].sort((a,b) => b.avgPerUser - a.avgPerUser)[0];
  if (intense.avgPerUser > 0.5) {
    insights.push({ icon:'📞', text:`Most intense outreach is in <b>${intense.label}</b> at ${intense.avgPerUser.toFixed(2)} calls per registered user.` });
  }

  const insightStrip = insights.length ? `
    <div class="mt-6 rounded-2xl bg-gradient-to-br from-indigo-50 to-violet-50 dark:from-indigo-950/40 dark:to-violet-950/40 border border-indigo-100 dark:border-indigo-900/40 p-4">
      <div class="flex items-center gap-1.5 mb-3">
        <svg class="w-3.5 h-3.5 text-indigo-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l1.5 4.5L18 8l-4.5 1.5L12 14l-1.5-4.5L6 8l4.5-1.5L12 2zM5 18l1 2.5L8.5 21l-2.5 1L5 24l-1-2-2.5-1L4 20l1-2zM19 14l1 2.5L22.5 17l-2.5 1L19 20l-1-2-2.5-1L18 16l1-2z"/></svg>
        <span class="text-[10px] uppercase tracking-wider font-bold text-indigo-600 dark:text-indigo-300">Auto Insights</span>
      </div>
      <ul class="space-y-2">
        ${insights.slice(0, 4).map(i => `<li class="flex items-start gap-2 text-xs text-zinc-700 dark:text-zinc-300"><span class="shrink-0">${i.icon}</span><span>${i.text}</span></li>`).join('')}
      </ul>
    </div>` : '';

  return summary + trend + timeline + insightStrip;
}

function renderDaily(daily, ev) {
  if (daily.length === 0) return '<div class="text-xs text-zinc-400 italic">No daily snapshots yet.</div>';
  const sym = moneySym(ev && ev.country);
  const maxRegs = Math.max(...daily.map(d => d.total_regs || 0), 1);
  const rows = daily.map(d => `
    <div class="grid grid-cols-12 items-center gap-2 sm:gap-3 text-xs py-1.5 border-b border-zinc-50 last:border-0">
      <div class="col-span-3 sm:col-span-2 text-zinc-500 whitespace-nowrap">${esc(fmtDate(d.registration_date))}</div>
      <div class="col-span-4 sm:col-span-5 h-2 progress-track rounded-full overflow-hidden">
        <div class="topic-fill h-full rounded-full" style="width: ${(100 * (d.total_regs || 0) / maxRegs).toFixed(0)}%;"></div>
      </div>
      <div class="col-span-3 sm:col-span-2 text-right font-semibold text-zinc-900 tabular-nums">${fmtNum(d.total_regs)}</div>
      <div class="hidden sm:block sm:col-span-2 text-right text-zinc-500 tabular-nums">${fmtMoney(d.total_spend, sym)}</div>
      <div class="col-span-2 sm:col-span-1 text-right text-zinc-500 tabular-nums">${d.cpiql != null ? sym + Math.round(d.cpiql) : '—'}</div>
    </div>
  `).join('');
  return `
    <div class="grid grid-cols-12 gap-2 sm:gap-3 text-[10px] uppercase tracking-wider text-zinc-400 font-semibold pb-2 border-b border-zinc-100">
      <div class="col-span-3 sm:col-span-2">Date</div>
      <div class="col-span-4 sm:col-span-5">Pacing</div>
      <div class="col-span-3 sm:col-span-2 text-right">${leadLabel(ev && ev.country, {long:true})}</div>
      <div class="hidden sm:block sm:col-span-2 text-right">Spend</div>
      <div class="col-span-2 sm:col-span-1 text-right">${cplLabel(ev && ev.country)}</div>
    </div>
    ${rows}
  `;
}

function linkRow(label, value, color, isKey) {
  const href = isKey ? '#' : esc(value);
  const sub  = isKey ? esc(value) : esc(value.replace(/^https?:\/\//, '').slice(0, 60));
  return `
    <a href="${href}" target="_blank" class="link-row flex items-center gap-3 px-3 py-2 rounded-lg no-underline">
      <div class="w-7 h-7 rounded-md bg-${color}-50 flex items-center justify-center">
        <svg class="w-3.5 h-3.5 text-${color}-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      </div>
      <div class="flex-1 min-w-0">
        <div class="text-xs font-medium text-zinc-900">${esc(label)}</div>
        <div class="text-[10px] text-zinc-500 truncate">${sub}</div>
      </div>
      <svg class="w-3.5 h-3.5 text-zinc-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
    </a>`;
}

applyTheme();
checkAuth();
</script>
