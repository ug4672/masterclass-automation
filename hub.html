    .signal-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
    .topic-strip { background: linear-gradient(90deg, var(--topic, #6366f1), transparent 70%); }
    .topic-glow { position: relative; }
    .topic-glow::before {
      content: ''; position: absolute; inset: 0; border-radius: inherit;
      background: radial-gradient(circle at top right, var(--topic, transparent), transparent 50%);
      opacity: 0.04; pointer-events: none;
    }
    .dark .topic-glow::before { opacity: 0.06; }
    .live-pulse { background: linear-gradient(90deg, #f43f5e, #ec4899); animation: liveGlow 1.5s ease-in-out infinite; }
    @keyframes liveGlow { 0%,100% { box-shadow: 0 0 0 0 rgba(244,63,94,0.7); } 50% { box-shadow: 0 0 0 8px rgba(244,63,94,0); } }
    .pacing-bar { height: 4px; border-radius: 2px; background: rgba(212,212,216,0.6); position: relative; overflow: hidden; }
    .dark .pacing-bar { background: rgba(63,63,70,0.5); }
    .pacing-bar > div { height: 100%; border-radius: 2px; transition: width 0.3s; }
    .card-attn { box-shadow: 0 0 0 1px rgba(244,63,94,0.18), 0 8px 32px -12px rgba(244,63,94,0.2); }
    .dark .card-attn { box-shadow: 0 0 0 1px rgba(244,63,94,0.25), 0 8px 32px -12px rgba(244,63,94,0.35); }
    .hide { display: none !important; }

    /* Login overlay */
    .login-overlay { position: fixed; inset: 0; background: #fafafa; display: flex; align-items: center; justify-content: center; z-index: 100; }
    .login-card { background: #ffffff; border: 1px solid #e4e4e7; border-radius: 16px; padding: 40px; max-width: 380px; width: 90%; text-align: center; }
    .login-logo { width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg,#6366f1,#22d3ee); display: flex; align-items: center; justify-content: center; color: #0a0a0b; font-weight: 700; font-size: 18px; margin: 0 auto 20px; }
    .login-title { font-size: 18px; font-weight: 600; color: #18181b; margin-bottom: 6px; }
    .login-sub { font-size: 13px; color: #71717a; margin-bottom: 24px; }
    .login-error { font-size: 12px; color: #f87171; margin-top: 12px; display: none; }
    .dark .login-overlay { background: #0a0a0b; }
    .dark .login-card { background: #18181b; border-color: #27272a; }
    .dark .login-title { color: #fafafa; }
    .dark .login-sub { color: #a1a1aa; }
    html:not(.dark) [class*="dark:bg-zinc-900"] { box-shadow: 0 1px 2px rgba(24,24,27,0.05), 0 1px 1px rgba(24,24,27,0.03); }
    html:not(.dark) header[class*="dark:bg-zinc-950"] { box-shadow: none; }
  </style>
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 antialiased min-h-screen">

            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New

          <button onclick="toggleTheme()" id="themeToggle" title="Toggle theme" class="w-8 h-8 rounded-lg flex items-center justify-center text-zinc-600 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-900"></button>
          <div class="relative">

            <div id="userMenu" class="hidden absolute right-0 top-10 bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-lg shadow-xl p-1 w-56 z-50">
              <div class="px-3 py-2 text-xs text-zinc-500 border-b border-zinc-200 dark:border-zinc-800" id="userEmail">—</div>

    <main class="max-w-[1400px] mx-auto px-8 py-10 space-y-10">

      <!-- HEADING -->
      <div class="flex items-end justify-between gap-4 flex-wrap">
        <div>

      <!-- ── UPCOMING ─────────────────────────────────────────────────── -->
      <div id="upcomingView">

      <!-- ── PAST ─────────────────────────────────────────────────────── -->
      <div id="pastView">
        <div class="mt-2 mb-6 flex items-baseline justify-between">

        <section class="mb-5">
          <div class="flex items-center justify-between gap-4 flex-wrap">

              <input id="pastSearch" oninput="renderPast()" type="text" placeholder="Search title, instructor…" class="w-72 px-3 py-2 rounded-lg bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 text-xs text-zinc-900 dark:text-zinc-100 placeholder:text-zinc-400 dark:text-zinc-600 focus:outline-none focus:border-zinc-300 dark:border-zinc-700">

                <option value="date">Date (newest)</option>
                <option value="roas">ROAS (highest first)</option>

      <div id="loadingArea" class="hide p-12 text-center text-zinc-500 text-sm">Loading…</div>
      <div id="errorArea"   class="hide p-12 text-center text-rose-600 dark:text-rose-400 text-sm"></div>

    </main>
  </div>

  <script>
    'use strict';

    const GOOGLE_CLIENT_ID = '801560849080-lgdgif7rjbgap4fqqp0cbcj7duc2ed0o.apps.googleusercontent.com';
    const TOPIC_COLORS = {
      ai_agents: '#a855f7', system_design: '#3b82f6', behavioral: '#f59e0b',
      data: '#10b981', ml: '#ec4899', distributed: '#6366f1',
    };
    const TOPIC_LABELS = {
      ai_agents: 'AI & Agents', system_design: 'System Design', behavioral: 'Behavioral',
      data: 'Data', ml: 'ML Eng', distributed: 'Distributed',
    };

    let currentCountry = (localStorage.getItem('ik_country') || 'IN').toUpperCase();
    let lastUpcoming = [];
    let lastPast     = [];
    let showAllPast = false;

    // ── Theme ────────────────────────────────────────────────
    const SUN_ICON  = '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2m11-11h-2m-18 0H1m17.07-7.07l-1.41 1.41M6.34 17.66l-1.41 1.41m12.73 0l-1.41-1.41M6.34 6.34L4.93 4.93"/></svg>';
    const MOON_ICON = '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
    function applyTheme() {
      const dark = document.documentElement.classList.contains('dark');
      const btn = document.getElementById('themeToggle');
      if (btn) btn.innerHTML = dark ? SUN_ICON : MOON_ICON;
    }
    function toggleTheme() {
      const dark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('ik_theme', dark ? 'dark' : 'light');
      applyTheme();
    }

    function applyCountryButtons() {
      const inEl = document.getElementById('ctryIN'), usEl = document.getElementById('ctryUS');
      const on  = 'px-3 py-1.5 bg-white dark:bg-zinc-900 text-zinc-900 dark:text-zinc-100 border-r border-zinc-200 dark:border-zinc-800';
      const off = 'px-3 py-1.5 text-zinc-500 hover:text-zinc-700 dark:hover:text-zinc-300';
      const onLast  = 'px-3 py-1.5 bg-white dark:bg-zinc-900 text-zinc-900 dark:text-zinc-100';
      const offLast = 'px-3 py-1.5 text-zinc-500 hover:text-zinc-700 dark:hover:text-zinc-300';
      inEl.className = currentCountry === 'IN' ? on : (off + ' border-r border-zinc-200 dark:border-zinc-800');
      usEl.className = currentCountry === 'US' ? onLast : offLast;
    }
    function setCountry(c) {
      if (currentCountry === c) return;
      currentCountry = c;
      localStorage.setItem('ik_country', c);
      applyCountryButtons();
      load();
    }
    function countryParam() { return currentCountry === 'US' ? 'US' : 'India'; }
    function isUS() { return currentCountry === 'US'; }
    function moneySym() { return isUS() ? '$' : '₹'; }

    // ── Auth ────────────────────────────────────────────────
    function showApp(email) {
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('appWrap').style.display = '';
      document.getElementById('userEmail').textContent = email;
      if (email) document.getElementById('avatarBtn').textContent = (email[0] || '?').toUpperCase() + (email.split('.')[1]?.[0] || '').toUpperCase();
      load();
    }
    function showLogin() {
      document.getElementById('loginOverlay').style.display = 'flex';
      document.getElementById('appWrap').style.display = 'none';
    }
    async function checkAuth() {
      try {
        const r = await fetch('/auth/check');
        if (r.ok) { const d = await r.json(); showApp(d.email); } else showLogin();
      } catch { showLogin(); }
    }
    async function handleGoogleSignIn(response) {
      const err = document.getElementById('loginError');
      err.style.display = 'none';
      try {
        const r = await fetch('/auth/verify', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({credential: response.credential}) });
        const d = await r.json();
        if (r.ok) showApp(d.email);
        else { err.textContent = d.error || 'Sign-in failed.'; err.style.display = 'block'; }
      } catch { err.textContent = 'Sign-in failed.'; err.style.display = 'block'; }
    }
    async function signOut() {
      await fetch('/auth/logout', { method: 'POST' });
      showLogin();
    }
    window.onGoogleLibraryLoad = function () {
      google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleGoogleSignIn, hd: 'interviewkickstart.com' });
      google.accounts.id.renderButton(document.getElementById('googleSignInBtn'), { theme: 'filled_black', size: 'large', width: 280 });
    };
    function toggleMenu() { document.getElementById('userMenu').classList.toggle('hidden'); }
    document.addEventListener('click', e => {
      if (!e.target.closest('#avatarBtn') && !e.target.closest('#userMenu')) {
        document.getElementById('userMenu')?.classList.add('hidden');
      }
    });

    // ── Helpers ─────────────────────────────────────────────
    function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function fmtDate(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }
    function fmtDateLong(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      return d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
    }
    function fmtTime(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit', timeZone: 'Asia/Kolkata' });
    }
    function fmtCountdown(iso) {
      if (!iso) return '—';
      const diffMs = new Date(iso) - new Date();
      if (diffMs < 0) {
        const hAgo = Math.round(-diffMs / 3600000);
        return hAgo < 24 ? `Aired ${hAgo}h ago` : `Aired ${Math.round(hAgo/24)}d ago`;
      }
      const h = diffMs / 3600000;
      if (h < 24) return `in ${Math.floor(h)}h ${Math.round((h % 1) * 60)}m`;
      const d = Math.floor(h/24);
      return d === 1 ? 'tomorrow' : `in ${d} days`;
    }
    function fmtN(n) {
      if (n == null || isNaN(n)) return '—';
      if (isUS()) {
        // US: K/M/B (thousands/millions/billions)
        if (n >= 1e9) return (n/1e9).toFixed(1).replace(/\.0$/,'') + 'B';
        if (n >= 1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'') + 'M';
        if (n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,'') + 'K';
        return Math.round(n).toLocaleString();
      }
      // India: k/L/Cr (thousand/lakh/crore)
      if (n >= 1e7) return (n/1e7).toFixed(2).replace(/\.00$/,'').replace(/0$/,'') + 'Cr';
      if (n >= 1e5) return (n/1e5).toFixed(1).replace(/\.0$/,'') + 'L';
      if (n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,'') + 'k';
      return Math.round(n).toLocaleString();
    }
    function fmtNRaw(n) {
      if (n == null || isNaN(n)) return '—';
      return Math.round(n).toLocaleString();
    }
    function fmtMoney(n) { return n == null ? '—' : moneySym() + fmtN(n); }
    function fmtMoneyRaw(n) { return n == null ? '—' : moneySym() + Math.round(n).toLocaleString(); }
    function fmtPct(n) { return n == null ? '—' : n.toFixed(1) + '%'; }
    function fmtROAS(n) { return n == null || isNaN(n) ? '—' : n.toFixed(2) + 'x'; }
    function initials(name) {
      if (!name) return 'IK';
      return name.split(/\s+/).filter(Boolean).map(s => s[0]).slice(0,2).join('').toUpperCase();
    }
    function topicColor(t) { return TOPIC_COLORS[t] || '#6366f1'; }
    function topicLabel(t) { return TOPIC_LABELS[t] || 'General'; }

    function goalPct(ev) {
      const t = ev.snapshot?.total_regs, g = ev.goal_regs;
      return (t != null && g > 0) ? Math.min(150, 100 * t / g) : null;
    }

    // Classify event into one of: live, at_risk, on_track, watch, queued, setup
    // (Called only for upcoming events now that hub renders both sections.)
    function statusFor(ev) {
      const s = ev.snapshot || {};
      const hrs = s.hours_to_live;
      const g = goalPct(ev);
      if (!ev.live_at || ev.goal_regs == null) return 'setup';
      if (hrs == null || s.total_regs == null) return 'queued';
      if (hrs < 24 && hrs > -2) return 'live';
      if (g != null && g < 70 && hrs < 168) return 'at_risk';
      if (g != null && g >= 100) return 'on_track';
      if (g != null && g >= 70)  return 'watch';
      return 'watch';
    }

    function statusBadge(st) {
      switch (st) {
        case 'live':     return { label: 'Going live',   cls: 'live-pulse text-white' };
        case 'at_risk':  return { label: 'Goal at risk', cls: 'bg-amber-100 dark:bg-amber-900/30 text-amber-700 dark:text-amber-300 border border-amber-300 dark:border-amber-900/50' };
        case 'on_track': return { label: 'On track',     cls: 'bg-emerald-100 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-900/50' };
        case 'watch':    return { label: 'Watch',        cls: 'bg-zinc-200 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-400 border border-zinc-300 dark:border-zinc-700' };
        case 'queued':   return { label: 'Queued',       cls: 'bg-indigo-100 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-300 border border-indigo-300 dark:border-indigo-900/50' };
        case 'setup':    return { label: 'Setup',        cls: 'bg-amber-100 dark:bg-amber-900/30 text-amber-700 dark:text-amber-300 border border-amber-300 dark:border-amber-900/50' };
        default:         return { label: '', cls: '' };
      }
    }

    // Revenue is already in local currency (INR for India, USD for US) — converted at snapshot time
    function revINR(s) { return s?.revenue ?? null; }
    function paidRevINR(s) { return s?.paid_revenue ?? null; }

    // ── Data load ───────────────────────────────────────────
    async function load() {
      showLoading();
      try {
        const country = encodeURIComponent(countryParam());
        const [rU, rP] = await Promise.all([
          fetch(`/events?status=upcoming&country=${country}&limit=1000`),
          fetch(`/events?status=aired&country=${country}&limit=1000`),
        ]);
        if (!rU.ok) throw new Error('HTTP ' + rU.status);
        if (!rP.ok) throw new Error('HTTP ' + rP.status);
        const [dU, dP] = await Promise.all([rU.json(), rP.json()]);
        lastUpcoming = dU.events || [];
        lastPast     = dP.events || [];
        hideLoading();
        render();
      } catch (e) {
        hideLoading();
        showError(e.message);
      }
    }

    function showLoading() {
      document.getElementById('upcomingView').classList.add('hide');
      document.getElementById('pastView').classList.add('hide');
      document.getElementById('sectionDivider').classList.add('hide');
      document.getElementById('errorArea').classList.add('hide');
      document.getElementById('loadingArea').classList.remove('hide');
    }
    function hideLoading() {
      document.getElementById('loadingArea').classList.add('hide');
    }
    function showError(msg) {
      document.getElementById('errorArea').classList.remove('hide');
      document.getElementById('errorArea').textContent = 'Failed to load: ' + msg;
    }

    function render() {
      document.getElementById('upcomingView').classList.remove('hide');
      document.getElementById('pastView').classList.remove('hide');
      document.getElementById('sectionDivider').classList.remove('hide');
      renderUpcoming();
      renderPast();
      document.getElementById('pastCount').textContent = lastPast.length + ' total';
    }

    // ── UPCOMING ────────────────────────────────────────────
    function renderUpcoming() {
      const events = lastUpcoming.slice().sort((a,b) => new Date(a.live_at||0) - new Date(b.live_at||0));

      // Buckets: nearest 2 events go in "Up Next" (regardless of date),
      // everything else goes into "After that". Removes the brittle 7/14-day
      // gates that left "This week" empty when nothing was imminent.
      const upNext   = events.slice(0, 2);
      const afterThat = events.slice(2);

      // Up Next (hero cards)
      const tw = document.getElementById('upNextArea');
      if (upNext.length === 0) {
        tw.innerHTML = `
          <h2 class="text-xl font-semibold tracking-tight mb-3">Up next</h2>
          <div class="p-8 text-center rounded-xl border border-dashed border-zinc-200 dark:border-zinc-800 text-zinc-500 text-sm">No upcoming masterclasses scheduled</div>`;
      } else {
        const isUrgent = upNext.some(ev => statusFor(ev) === 'live' || statusFor(ev) === 'at_risk');
        tw.innerHTML = `
          <div class="flex items-center justify-between mb-5">
            <div class="flex items-center gap-2">
              <h2 class="text-xl font-semibold tracking-tight">Up next</h2>
              ${isUrgent ? '<span class="text-[10px] font-semibold px-2 py-0.5 rounded bg-rose-100 dark:bg-rose-900/40 text-rose-700 dark:text-rose-300 border border-rose-300 dark:border-rose-900/60 uppercase tracking-widest">Urgent</span>' : ''}
            </div>
            <span class="text-[11px] text-zinc-400 dark:text-zinc-600">${upNext.length} of ${events.length}</span>
          </div>
          <div class="grid ${upNext.length === 1 ? 'grid-cols-1' : 'grid-cols-2'} gap-5">
            ${upNext.map(heroCard).join('')}
          </div>`;
      }

      // After that — remaining events as compact rows
      const n2 = document.getElementById('afterArea');
      if (afterThat.length === 0) {
        n2.innerHTML = '';
      } else {
        n2.innerHTML = `
          <div class="flex items-center justify-between mb-5">
            <h2 class="text-xl font-semibold tracking-tight">After that</h2>
            <span class="text-[11px] text-zinc-400 dark:text-zinc-600">${afterThat.length} more</span>
          </div>
          <div class="space-y-2.5">${afterThat.map(rowCard).join('')}</div>`;
      }
    }

    function heroCard(ev) {
      const s = ev.snapshot || {};
      const st = statusFor(ev);
      const badge = statusBadge(st);
      const color = topicColor(ev.topic);
      const g = goalPct(ev);
      const cardBorder = st === 'live' ? 'border-rose-300 dark:border-rose-900/40 card-attn' : st === 'at_risk' ? 'border-amber-300 dark:border-amber-900/40' : 'border-zinc-200 dark:border-zinc-800';
      const pacingColor = g == null ? 'zinc' : g >= 100 ? 'emerald' : g >= 70 ? 'zinc' : 'amber';
      const pacingFill = pacingColor === 'emerald' ? 'bg-gradient-to-r from-emerald-500 to-emerald-400'
                       : pacingColor === 'amber' ? 'bg-gradient-to-r from-amber-500 to-amber-400'
                       : 'bg-zinc-600';
      const recommendation = st === 'at_risk' ? `<div class="text-[10px] text-amber-300/80 mt-2">→ Increase Meta budget or extend by 1–2 days</div>` : '';

      return `
        <a href="/event.html?id=${encodeURIComponent(ev.event_id)}" class="topic-glow p-7 rounded-2xl bg-white dark:bg-zinc-900 border ${cardBorder} cursor-pointer block no-underline relative overflow-hidden" style="--topic:${color};">
          <div class="absolute top-0 left-0 right-0 h-1 topic-strip"></div>
          <div class="relative">
            <div class="flex items-center justify-between mb-6">
              <div class="flex items-center gap-2">
                <span class="px-2 py-0.5 rounded-md text-[10px] font-bold uppercase tracking-widest ${badge.cls}">${esc(badge.label)}</span>
                <span class="text-[11px] text-zinc-600 dark:text-zinc-400 font-medium">${esc(fmtCountdown(ev.live_at))}</span>
              </div>
              <span class="text-[10px] uppercase tracking-widest font-semibold px-2 py-1 rounded text-zinc-700 dark:text-zinc-300" style="background:${color}22;color:${color};">${esc(topicLabel(ev.topic))}</span>
            </div>
            <h3 class="text-2xl font-bold leading-tight mb-4 tracking-tight text-zinc-900 dark:text-zinc-50">${esc(ev.title || '—')}</h3>
            <div class="flex items-center gap-3 mb-6">
              <div class="w-9 h-9 rounded-full bg-gradient-to-br from-indigo-400 to-violet-500 flex items-center justify-center text-white text-xs font-bold">${esc(initials(ev.instructor_name))}</div>
              <div>
                <div class="text-sm font-medium text-zinc-900 dark:text-zinc-100">${esc(ev.instructor_name || '—')}</div>
                <div class="text-[11px] text-zinc-500">${esc(ev.instructor_role || '')}</div>
              </div>
            </div>
            <div class="grid grid-cols-3 gap-4 mb-5 pb-5 border-b border-zinc-200 dark:border-zinc-800">
              <div>
                <div class="text-[10px] uppercase tracking-widest text-zinc-500 mb-1">Registered</div>
                <div class="text-lg font-bold tabular ${g != null && g < 70 ? 'text-amber-600 dark:text-amber-400' : 'text-zinc-900 dark:text-zinc-100'}">${fmtNRaw(s.total_regs)}${ev.goal_regs ? `<span class="text-xs text-zinc-500"> / ${fmtNRaw(ev.goal_regs)}</span>` : ''}</div>
              </div>
              <div>
                <div class="text-[10px] uppercase tracking-widest text-zinc-500 mb-1">CPIQL</div>
                <div class="text-lg font-bold tabular ${s.cpiql && s.cpiql < 200 ? 'text-emerald-600 dark:text-emerald-400' : 'text-zinc-900 dark:text-zinc-100'}">${fmtMoneyRaw(s.cpiql)}</div>
              </div>
              <div>
                <div class="text-[10px] uppercase tracking-widest text-zinc-500 mb-1">Spend</div>
                <div class="text-lg font-bold tabular text-zinc-900 dark:text-zinc-100">${fmtMoneyRaw(s.meta_spend)}</div>
              </div>
            </div>
            ${g != null ? `
            <div class="space-y-2">
              <div class="flex justify-between items-center text-[11px]">
                <span class="text-zinc-500">Goal pacing</span>
                <span class="text-${pacingColor}-400 font-semibold">${g.toFixed(0)}% ${g >= 100 ? '· ahead' : g >= 70 ? '· on pace' : '· behind'}</span>
              </div>
              <div class="pacing-bar"><div class="${pacingFill}" style="width: ${Math.min(100,g).toFixed(0)}%;"></div></div>
              ${recommendation}
            </div>` : ''}
          </div>
        </a>`;
    }

    function midCard(ev) {
      const s = ev.snapshot || {};
      const color = topicColor(ev.topic);
      return `
        <a href="/event.html?id=${encodeURIComponent(ev.event_id)}" class="topic-glow p-5 rounded-xl bg-white dark:bg-zinc-900/50 border border-zinc-200 dark:border-zinc-800 hover:border-zinc-300 dark:hover:border-zinc-700 block no-underline relative overflow-hidden" style="--topic:${color};">
          <div class="absolute top-0 left-0 right-0 h-0.5 topic-strip"></div>
          <div class="flex items-center justify-between mb-3">
            <span class="text-[10px] uppercase tracking-widest font-semibold px-2 py-0.5 rounded" style="background:${color}22;color:${color};">${esc(topicLabel(ev.topic))}</span>
            <span class="text-[10px] text-zinc-500 font-medium">${esc(fmtCountdown(ev.live_at))}</span>
          </div>
          <h3 class="text-sm font-semibold leading-snug text-zinc-900 dark:text-zinc-100 mb-4">${esc(ev.title || '—')}</h3>
          <div class="flex justify-between items-end pt-3 border-t border-zinc-200 dark:border-zinc-800">
            <div class="text-[11px] text-zinc-500">${esc(ev.instructor_name || '—')}</div>
            <div class="text-sm font-bold tabular text-zinc-900 dark:text-zinc-100">${fmtNRaw(s.total_regs)}<span class="text-[10px] text-zinc-500"> regs</span></div>
          </div>
        </a>`;
    }

    function rowCard(ev) {
      const s = ev.snapshot || {};
      const st = statusFor(ev);
      const badge = statusBadge(st);
      const color = topicColor(ev.topic);
      const g = goalPct(ev);
      const d = ev.live_at ? new Date(ev.live_at) : null;
      const dow = d ? d.toLocaleDateString('en-US', {weekday:'short'}) : 'TBD';
      const dateStr = d ? d.toLocaleDateString('en-US', {month:'short', day:'numeric'}) : '—';
      const timeStr = d ? d.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit', timeZone:'Asia/Kolkata'}) : '';
      const pacingTxt = g != null ? `${g.toFixed(0)}% paced` : (st === 'setup' ? 'no goal set' : '—');
      const pacingCls = g == null ? 'text-zinc-500' : g >= 100 ? 'text-emerald-600 dark:text-emerald-400' : g >= 70 ? 'text-zinc-600 dark:text-zinc-400' : 'text-amber-600 dark:text-amber-400';

      return `
        <a href="/event.html?id=${encodeURIComponent(ev.event_id)}" class="topic-glow grid grid-cols-12 gap-4 items-center p-4 rounded-xl bg-white/80 dark:bg-zinc-900/40 border border-zinc-200 dark:border-zinc-800 hover:border-zinc-300 dark:hover:border-zinc-700 block no-underline" style="--topic:${color};">
          <div class="col-span-1">
            <div class="text-[10px] uppercase tracking-widest text-zinc-500">${esc(dow)}</div>
            <div class="text-base font-bold tracking-tight text-zinc-900 dark:text-zinc-100">${esc(dateStr)}</div>
            <div class="text-[10px] text-zinc-500 mt-0.5">${esc(timeStr)}</div>
          </div>
          <div class="col-span-4">
            <div class="text-sm font-semibold tracking-tight text-zinc-900 dark:text-zinc-100">${esc(ev.title || '—')}</div>
            <div class="text-[11px] text-zinc-500 mt-0.5">${esc(ev.instructor_name || '—')}${ev.instructor_role ? ' · ' + esc(ev.instructor_role) : ''}</div>
          </div>
          <div class="col-span-2 text-right">
            <div class="text-sm font-bold tabular text-zinc-900 dark:text-zinc-100">${fmtNRaw(s.total_regs)} ${ev.goal_regs ? `<span class="text-zinc-500 text-xs">/ ${fmtNRaw(ev.goal_regs)}</span>` : ''}</div>
            <div class="text-[10px] ${pacingCls} mt-0.5">${esc(pacingTxt)}</div>
          </div>
          <div class="col-span-2 text-right">
            <div class="text-sm font-bold tabular ${s.cpiql && s.cpiql < 200 ? 'text-emerald-600 dark:text-emerald-400' : 'text-zinc-900 dark:text-zinc-100'}">${fmtMoneyRaw(s.cpiql)}</div>
            <div class="text-[10px] text-zinc-500 mt-0.5">CPIQL</div>
          </div>
          <div class="col-span-2 text-right">
            <div class="text-sm font-bold tabular text-zinc-900 dark:text-zinc-100">${fmtMoneyRaw(s.meta_spend)}</div>
            <div class="text-[10px] text-zinc-500 mt-0.5">spent</div>
          </div>
          <div class="col-span-1 text-right">
            <span class="text-[10px] px-2 py-1 rounded font-semibold uppercase tracking-widest ${badge.cls}">${esc(badge.label)}</span>
          </div>
        </a>`;
    }

    // ── PAST ───────────────────────────────────────────────
    function renderPast() {
      let events = lastPast.slice();
      const q = (document.getElementById('pastSearch')?.value || '').toLowerCase().trim();
      if (q) events = events.filter(ev =>
        (ev.title || '').toLowerCase().includes(q) ||
        (ev.instructor_name || '').toLowerCase().includes(q)
      );

      const sort = document.getElementById('pastSort')?.value || 'date';
      const score = ev => {
        const s = ev.snapshot || {};
        switch (sort) {
          case 'roas':    return s.overall_roas ?? 0;
          case 'revenue': return revINR(s) ?? 0;
          case 'sales':   return s.sales ?? 0;
          case 'date':    return ev.live_at ? new Date(ev.live_at).getTime() : 0;
          case 'cpiql':   return -(s.cpiql ?? Infinity);
          case 'regs':    return s.total_regs ?? 0;
        }
        return 0;
      };
      events.sort((a,b) => score(b) - score(a));

      renderPastTable(events);
    }

    function renderPastTable(events) {
      if (events.length === 0) {
        document.getElementById('pastTableArea').innerHTML = `<div class="card rounded-2xl p-12 text-center text-zinc-500 border border-zinc-200 dark:border-zinc-800">No past events match your filters</div>`;
        return;
      }

      // Determine top/bottom 3 by ROAS (excluding pipeline-open)
      const closed = events.filter(ev => !isPipelineOpen(ev) && ev.snapshot?.overall_roas != null).sort((a,b) => (b.snapshot.overall_roas||0) - (a.snapshot.overall_roas||0));
      const top3 = new Set(closed.slice(0, 3).map(e => e.event_id));
      const bot3 = new Set(closed.slice(-3).map(e => e.event_id));

      // Collapse middle?
      const showAll = showAllPast || events.length <= 9;
      const visibleRows = showAll ? events : [...events.slice(0, 3), 'COLLAPSE', ...events.slice(-3)];

      const rows = visibleRows.map(ev => {
        if (ev === 'COLLAPSE') {
          const hidden = events.length - 6;
          return `<tr class="bg-zinc-950/40 cursor-pointer hover:bg-zinc-100 dark:hover:bg-zinc-900/50" onclick="showAllPast = true; renderPast();">
            <td colspan="6" class="px-4 py-2.5 text-center text-[11px] text-zinc-400 dark:text-zinc-600 hover:text-zinc-600 dark:text-zinc-400">↓ ${hidden} more event${hidden===1?'':'s'} ↓</td>
          </tr>`;
        }
        return tableRow(ev, top3, bot3);
      }).join('');

      document.getElementById('pastTableArea').innerHTML = `
        <div class="rounded-xl border border-zinc-200 dark:border-zinc-800 overflow-hidden bg-white/70 dark:bg-zinc-900/30">
          <table class="w-full text-sm tabular">
            <thead class="bg-zinc-100 dark:bg-zinc-900/60 text-[10px] uppercase tracking-widest text-zinc-500">
              <tr>
                <th class="text-left px-4 py-3 font-medium w-28">Date</th>
                <th class="text-left px-4 py-3 font-medium">Event</th>
                <th class="text-right px-4 py-3 font-medium">IQLs / Att%</th>
                <th class="text-right px-4 py-3 font-medium">Spend</th>
                <th class="text-right px-4 py-3 font-medium">Revenue / Sales</th>
                <th class="text-right px-4 py-3 font-medium">ROAS</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-zinc-200 dark:divide-zinc-900">${rows}</tbody>
          </table>
        </div>
        <div class="mt-4 flex items-center justify-between text-[11px] text-zinc-500">
          <div>Showing ${showAll ? events.length : Math.min(6, events.length)} of ${events.length}${!showAll ? ` · <button class="text-zinc-700 dark:text-zinc-300 hover:text-zinc-900 dark:hover:text-zinc-100 underline" onclick="showAllPast = true; renderPast();">show all</button>` : ''}</div>
          <div>* ROAS reflects open pipeline · expect 25–40% lift over 2 weeks</div>
        </div>`;
    }

    function isPipelineOpen(ev) {
      if (!ev.live_at) return false;
      const days = (Date.now() - new Date(ev.live_at).getTime()) / 86400000;
      return days >= 0 && days < 14;
    }

    function tableRow(ev, top3, bot3) {
      const s = ev.snapshot || {};
      const open = isPipelineOpen(ev);
      const roas = s.overall_roas;
      const rowCls = top3.has(ev.event_id) ? 'row-top' : bot3.has(ev.event_id) ? 'row-bot' : 'row-mid';
      const roasCls = roas == null ? 'text-zinc-500'
                    : roas >= 8 ? 'gradient-text-em font-bold text-base'
                    : roas >= 4 ? 'text-emerald-600 dark:text-emerald-400 font-bold'
                    : roas >= 2 ? 'text-zinc-800 dark:text-zinc-200 font-semibold'
                    : 'text-rose-600 dark:text-rose-400 font-bold';

      return `
        <tr class="${rowCls} hover:bg-zinc-100 dark:hover:bg-zinc-900/40 cursor-pointer" onclick="goToEvent('${esc(ev.event_id)}')">
          <td class="px-4 py-3 text-zinc-700 dark:text-zinc-300 whitespace-nowrap">${esc(fmtDate(ev.live_at))}</td>
          <td class="px-4 py-3">
            <div class="font-medium text-zinc-900 dark:text-zinc-100">${esc(ev.title || ev.event_id)}</div>
            <div class="text-[11px] text-zinc-500">${esc(ev.instructor_name || '—')}${ev.instructor_role ? ' · ' + esc(ev.instructor_role) : ''}</div>
          </td>
          <td class="px-4 py-3 text-right">
            <div class="text-zinc-900 dark:text-zinc-100">${fmtNRaw(s.total_regs)}</div>
            <div class="text-[11px] text-zinc-500">${s.attendance_pct != null ? s.attendance_pct.toFixed(0) + '% att' : '—'}</div>
          </td>
          <td class="px-4 py-3 text-right text-zinc-900 dark:text-zinc-100">${fmtMoneyRaw(s.meta_spend)}</td>
          <td class="px-4 py-3 text-right">
            <div class="font-medium text-zinc-900 dark:text-zinc-100">${revINR(s) ? fmtMoney(revINR(s)) : '—'}</div>
            <div class="text-[11px] text-zinc-500">${s.sales != null ? s.sales + ' sales' : '—'}</div>
          </td>
          <td class="px-4 py-3 text-right ${roasCls}">${fmtROAS(roas)}${open ? '*' : ''}</td>
        </tr>`;
    }

    function goToEvent(id) {
      window.location.href = '/event.html?id=' + encodeURIComponent(id);
    }

    applyCountryButtons();
    applyTheme();
    checkAuth();
  </script>
</body>
</html>
